  function down(ev, id, svg){
    const i = items.find(x => x.id === id); if (!i || i.fixed || released) return;
    ev.preventDefault(); dragId = id;
    const mv = e => { const p = toX(e, svg); if (p.y > 242) i.x = null; else i.x = Math.max(-o.half, Math.min(o.half, Math.round((p.x - cx) / sc / o.snap) * o.snap)); render(); const n = U.$('svg', view); };
    const up = e => { document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); dragId = null; render(); };
    document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up);
  }
  function key(ev, id){
    const i = items.find(x => x.id === id); if (!i || i.fixed || released) return;
    let ch = true;
    if (ev.key === 'ArrowRight') i.x = Math.min(o.half, (i.x == null ? -o.snap : i.x) + o.snap);
    else if (ev.key === 'ArrowLeft') i.x = Math.max(-o.half, (i.x == null ? o.snap : i.x) - o.snap);
    else if (ev.key === 'Escape' || ev.key === 'Delete' || ev.key === 'ArrowDown') i.x = null;
    else ch = false;
    if (ch) { ev.preventDefault(); o.focusId = id; render(); }
  }
  function release(){
    const t = totals(); const unplaced = items.filter(i => i.x == null && !i.fixed).length;
    if (o.requireAllPlaced && unplaced) { msgEl.textContent = 'Place all the weights on the beam first.'; return; }
    released = true;
    const ref = Math.max(t.acw, t.cw, 1);
    tilt = Math.abs(t.net) < TOL ? 0 : Math.max(-14, Math.min(14, 14 * t.net / ref * 2.5));
    const res = Math.abs(t.net) < TOL ? 'bal' : (t.net > 0 ? 'cw' : 'acw');
    const words = {bal:'The beam balances: clockwise = anticlockwise.', cw:'The beam turns clockwise ↻ (' + U.n(t.cw, 2) + ' Nm is bigger than ' + U.n(t.acw, 2) + ' Nm).', acw:'The beam turns anticlockwise ↺ (' + U.n(t.acw, 2) + ' Nm is bigger than ' + U.n(t.cw, 2) + ' Nm).'};
    let m = words[res];
    if (o.predict && pred.value) m += pred.value === res ? ' ✔ Your prediction was right!' : ' ✘ Your prediction was different – check each moment (F × d) and compare.';
    msgEl.textContent = m; render();
    if (o.onRelease) o.onRelease(Object.assign({result:res, unplaced, items:items.map(i => Object.assign({}, i))}, t));
  }
  function reset(){ released = false; tilt = 0; msgEl.textContent = ''; render(); }
  render();
  return {items, reset, totals, release};
};

/* ---------- lever lab ---------- */
W.leverLab = function(el){
  const wrap = h('div', {class:'widget'}, h('h4', {}, 'Lever lab: drag the sliders to place the pivot, load and effort')); el.append(wrap);
  let p = 50, l = 20, e = 90, Lf = 300;
  const view = h('div'), read = h('div', {class:'readout', 'aria-live':'polite'}), ctl = h('div', {class:'ctl'});
  const sP = slider('Pivot position', 5, 95, 5, p, '', v => { p = v; draw(); }), sL = slider('Load position', 5, 95, 5, l, '', v => { l = v; draw(); }), sE = slider('Effort position', 5, 95, 5, e, '', v => { e = v; draw(); }), sF = slider('Load force', 50, 600, 50, Lf, 'N', v => { Lf = v; draw(); });
  [sP, sL, sE].forEach(s => s.out.textContent = '');
  ctl.append(...sP.row, ...sL.row, ...sE.row, ...sF.row);
  const btns = h('div', {class:'row'}, [['1st class', [50, 15, 85]], ['2nd class (wheelbarrow)', [10, 40, 90]], ['3rd class (tweezers)', [10, 90, 45]]].map(([n, v]) => h('button', {class:'btn sm', onclick(){ p = v[0]; l = v[1]; e = v[2]; sP.set(p); sL.set(l); sE.set(e); sP.out.textContent = sL.out.textContent = sE.out.textContent = ''; draw(); }}, 'Show a ' + n)));
  wrap.append(btns, view, read, ctl);
  function draw(){
    const X = v => 40 + v * 6.4; // 100 units -> 640 px => 1 unit = 1 cm... treat unit as 1 cm
    const la = Math.abs(l - p), ea = Math.abs(e - p);
    let cls = (p > Math.min(l, e) && p < Math.max(l, e)) ? 1 : (l > Math.min(p, e) && l < Math.max(p, e)) ? 2 : (e > Math.min(p, l) && e < Math.max(p, l)) ? 3 : 0;
    const eff = ea > 0 ? Lf * la / ea : Infinity; const MA = la > 0 ? ea / la : Infinity;
    const effDown = cls === 1;
    let g = `<rect x="40" y="120" width="640" height="14" rx="5" fill="var(--c2)" stroke="var(--text)" stroke-width="2"/>`;
    g += `<polygon points="${X(p)},134 ${X(p) - 20},180 ${X(p) + 20},180" fill="var(--text)"/><text x="${X(p)}" y="198" text-anchor="middle" class="lbl">pivot</text>`;
    g += D.arrow(X(l), 40, X(l), 118, 'var(--c1)', 5) + `<text x="${X(l)}" y="32" text-anchor="middle" class="lbl">load ${Lf} N</text>`;
    if (isFinite(eff)) g += (effDown ? D.arrow(X(e), 40, X(e), 118, 'var(--good)', 5) + `<text x="${X(e)}" y="32" text-anchor="middle" class="lbl">effort ${U.n(eff, 1)} N</text>` : D.arrow(X(e), 214, X(e), 136, 'var(--good)', 5) + `<text x="${X(e)}" y="232" text-anchor="middle" class="lbl">effort ${U.n(eff, 1)} N</text>`);
    g += `<line x1="${X(p)}" y1="150" x2="${X(l)}" y2="150" stroke="var(--c1)" stroke-width="2"/><line x1="${X(p)}" y1="160" x2="${X(e)}" y2="160" stroke="var(--good)" stroke-width="2"/>`;
    view.innerHTML = D.svg(720, 250, g, 'Lever diagram with adjustable pivot, load and effort');
    const names = {1:'1st class – pivot in the middle', 2:'2nd class – load in the middle', 3:'3rd class – effort in the middle', 0:'Move the sliders so the three are in different places'};

/* ---------- bus challenge ---------- */
const ZONES = [-4, -3, -2, -1, 1, 2, 3, 4];
W.busSolutions = function(sc){
  let count = 0, example = null;
  const base = sc.fixed.reduce((a, f) => a + (f.x > 0 ? f.F * f.x : -f.F * -f.x), 0); // net clockwise from fixed
  (function rec(i, left, net, arr){
    if (i === 8) { if (left === 0 && Math.abs(net) < 1e-9) { count++; if (!example) example = arr.slice(); } return; }
    for (let n = 0; n <= 2 && n <= left; n++) { arr.push(n); rec(i + 1, left - n, net + n * sc.pw * ZONES[i], arr); arr.pop(); }
  })(0, sc.pax, base, []);
  return {count, example};
};
W.busScenario = function(r){
  for (let tries = 0; tries < 400; tries++) {
    const xs = U.shuffle(r, [-4, -3, -2, -1, 1, 2, 3, 4]).slice(0, 4);
    if (xs.every(x => x < 0) || xs.every(x => x > 0)) continue;

};
W.busChallenge = function(el, sc, o){

W.virtualLab = function(el, o){

<script>/* Question generators: every function takes a seeded random function r and returns a question object with fresh numbers. */
(function(){
const U = PA.util, Q = PA.Q, G = PA.gen, D = PA.diag;
const n = U.n, pick = U.pick, int = U.int, step = U.step;
const UW = ['J', 'N', 'W', 'Nm', 'm', 's'];
const lab = (c, t) => c + ' ' + t;

/* ============ WORK ============ */
const pushCtx = ['A student pushes a box', 'A caretaker pushes a trolley', 'A shop worker pushes a pallet truck', 'A dog pulls a sledge', 'A mechanic pushes a broken-down car', 'A porter pushes a luggage cart'];
G.workFindW = (r, lvl) => {
  let F, s;
  do { F = lvl === 2 ? step(r, 25, 250, 5) : step(r, 10, 60, 5); s = lvl === 2 ? int(r, 3, 25) : int(r, 2, 10); } while (F === 40 && s === 5);
  const W = F * s;
  return {type:'num', prompt:`${pick(r, pushCtx)} with a force of <b>${F} N</b>. It moves <b>${s} m</b> in the direction of the force. Calculate the work done.`, answer:W, unit:'J', unitChoices:UW, label:'Work done',
    hint:'Use W = F × s.', explain:'Work done is the energy transferred mechanically.', steps:['Equation: W = F × s', `Substitute: W = ${F} × ${s}`, `Answer: <b>W = ${W} J</b>`],
    common:[{value:F + s, msg:'You added the force and the distance. Work done = force <b>×</b> distance.'}]};
};
G.workFindF = r => {
  const F = step(r, 5, 200, 5), s = int(r, 2, 20), W = F * s;
  return {type:'num', prompt:`A machine does <b>${W} J</b> of work while moving a load <b>${s} m</b> in the direction of the force. Calculate the force.`, answer:F, unit:'N', unitChoices:UW, label:'Force',
    hint:'Rearrange W = F × s to get F = W ÷ s.', steps:['W = F × s, so F = W ÷ s', `F = ${W} ÷ ${s}`, `<b>F = ${F} N</b>`], common:[{value:W * s, msg:'You multiplied. To find F you divide: F = W ÷ s.'}]};
};
G.workFindS = r => {

/* ============ LEVERS ============ */

const CL = {1:'First-class lever', 2:'Second-class lever', 3:'Third-class lever'};
G.leverClassify = r => {
  const t = pick(r, TOOLS);

};
G.leverDiagram = r => {

G.leverMatch = r => ({type:'match', prompt:'Match each lever to its class.', left:['Wheelbarrow', 'Scissors', 'Tweezers', 'Human forearm'], right:['First class', 'Second class', 'Third class'], pairs:[1, 0, 2, 2], explain:'Use F-L-E: Fulcrum in the middle = 1st, Load = 2nd, Effort = 3rd.'});
function leverNums(r){
  for (let i = 0; i < 200; i++) {
    const La = pick(r, [0.1, 0.2, 0.25, 0.3, 0.4, 0.5]), Ea = pick(r, [0.4, 0.5, 0.6, 0.8, 1.0, 1.2, 1.5]), Ld = step(r, 100, 600, 50), E = Ld * La / Ea;

}

    hint:'effort × effort arm = load × load arm', steps:[`Load moment = ${c.Ld} × ${n(c.La)} = ${n(c.Ld * c.La)} Nm`, `Effort × ${n(c.Ea)} = ${n(c.Ld * c.La)}`, `<b>Effort = ${n(c.E)} N</b>`], common:[{value:c.Ld, msg:'The effort is not equal to the load – compare moments using the two arms.'}]};
};
G.leverMA = r => {
  const E = step(r, 20, 150, 10), k = pick(r, [2, 3, 4, 5, 6]), Ld = E * k;
  return {type:'num', prompt:`A lever lifts a load of <b>${Ld} N</b> using an effort of <b>${E} N</b>. Calculate the mechanical advantage.`, answer:k, unit:'none', label:'MA', hint:'MA = load ÷ effort. It has no unit.',
    steps:['MA = load ÷ effort', `MA = ${Ld} ÷ ${E}`, `<b>MA = ${k}</b> (no unit – it is a ratio)`], common:[{value:E / Ld, msg:'You divided the wrong way round. MA = load ÷ effort.'}], explain:'The lever multiplies the force ' + k + ' times.'};

G.leverMAmeaning = r => {
  const v = pick(r, [0.5, 1, 3]);

/* ============ ENERGY & FORCES (M1) ============ */

G.energyStore = r => { const s = pick(r, STORES); return Q.mcq(r, s[0], s[1], s[2], {explain:'Name the store that matches the change you can see.', hint:'Think about what is changing: height, speed, shape, fuel, temperature.'}); };
G.energyPathway = r => ({type:'match', prompt:'Match each event to the pathway used to transfer the energy.', left:['A person pushes a box across the floor', 'A kettle element heats the water inside', 'The Sun warms the Earth’s surface', 'A current flows through a lamp'], right:['Mechanically (by a force)', 'By heating', 'By radiation', 'Electrically'], pairs:[0, 1, 2, 3].map(i => i), explain:'Four pathways: mechanically, electrically, by heating, by radiation.'});
G.energyConserve = r => Q.mcq(r, 'A ball is dropped and bounces, but each bounce is lower. Which statement is correct?', 'Some energy is dissipated to the thermal store of the surroundings, but the total energy is conserved', [{t:'Energy is destroyed when the ball hits the ground', why:'Energy cannot be created or destroyed – it is conserved.'}, {t:'The ball has used up its energy and has none left', why:'The energy has been transferred to other stores (mostly thermal), not “used up”.'}, {t:'Energy is created by the bounce, so the ball goes higher', why:'No energy is created. Each bounce is lower because energy is dissipated.'}], {explain:'Total energy is always conserved. It is often dissipated into the thermal stores of the surroundings, making it less useful.'});
G.resultant2 = r => {

  const horiz = r() < 0.7;

  return {type:'multi', prompt:`The diagram shows two forces on an object: <b>${a} N</b> ${horiz ? 'to the right' : 'upwards'} and <b>${b} N</b> ${horiz ? 'to the left' : 'downwards'}.`,
    diagram:D.forceDiagram([{dir:fA, mag:a}, {dir:fB, mag:b}]), diagramAlt:`Force arrows of ${a} N and ${b} N in opposite directions`,

};
G.rocketResultant = r => {

/* ============ INVESTIGATION ============ */

    hint:'Add the readings and divide by how many there are.', steps:[`Add: ${a.toFixed(1)} + ${b.toFixed(1)} + ${c.toFixed(1)} = ${n(a + b + c, 1)}`, `Divide by 3: ${n(a + b + c, 1)} ÷ 3 = ${n(exact, 3)}`, `Round to 1 d.p.: <b>${m.toFixed(1)} N</b>`], common:[{value:U.round(a + b + c, 1), msg:'You added but did not divide by 3.'}]};

G.invGraph = r => {

    steps:[`Find ${x0} kg on the x-axis`, 'Go up to the line of best fit, then across to the y-axis', `Read off about <b>${n(y0, 2)} J</b>`]};
};
G.invReliability = r => Q.mcq(r, 'Which change would make the evidence from a friction investigation more <b>reliable</b>?', 'Repeat each measurement several times and calculate a mean', [{t:'Use a different surface for each mass', why:'That would break the fair test (validity), not improve reliability.'}, {t:'Only take one very careful reading for each mass', why:'One reading cannot show whether results are repeatable.'}, {t:'Ignore any results that look odd', why:'Ignoring data is poor practice; reliability comes from repeats.'}], {explain:'Reliable = repeatable. Repeats and means reduce the effect of random error.'});
G.invValidity = r => Q.mcq(r, 'A group lets different students pull at different speeds for each mass. What is the main problem with this?', 'Speed is not controlled, so the test is not fair and the results are less valid', [{t:'The results are less reliable only because the numbers are too big', why:'The problem is an uncontrolled variable – it affects validity.'}, {t:'There is no problem – speed does not matter', why:'Speed can change the friction reading – it should be a control variable.'}, {t:'The dependent variable has been changed deliberately', why:'The independent variable is the total mass; speed is an uncontrolled variable here.'}], {explain:'Valid = a fair test measuring what it claims to. Control variables must be kept constant.'});
G.invExplain = r => ({type:'explain', marks:3, prompt:'A group repeated each measurement three times and noticed that one force reading was much larger than the other two. Explain what the group should do and why.',
  scheme:[{t:'Keep / do not delete the raw reading; mark it as a possible anomaly', kw:[['anomal', 'odd', 'unusual', 'different'], ['keep', 'not delete', 'don', 'record']]}, {t:'Repeat the measurement (or investigate possible causes such as reading the starting peak)', kw:[['repeat', 'again', 'retake']]}, {t:'Only exclude it from the mean if there is a scientific reason; the mean then makes the evidence more reliable', kw:[['mean', 'reason', 'reliable']]}],
  model:'The group should keep the raw reading but mark it as a possible anomaly, then repeat the measurement and investigate the cause (for example reading the starting peak force instead of the steady force). It should only be left out of the mean if there is a scientific reason. Calculating a mean of the repeats makes the evidence more reliable.', tip:'Three ideas: keep the data, repeat/investigate, only exclude with a reason.'});
G.invConclusion = r => Q.mcq(r, 'A graph of work done against total mass is a straight line sloping upwards that does not pass through the origin. Which is the best conclusion?', 'As total mass increases, work done increases in a roughly linear way', [{t:'Work done is directly proportional to mass', why:'A directly proportional graph passes through the origin; this one does not.'}, {t:'Mass has no effect on work done', why:'The line slopes upward, so mass does affect work done.'}, {t:'As mass increases work done decreases', why:'The line slopes upward – work done increases.'}], {explain:'Describe the pattern shown by the evidence; do not claim more than the data show.'});
G.invGroupAB = r => Q.mcq(r, 'Group A says “mass has no effect on work done”. Group B says “as mass increases, work done increases”. Their data: 0.4 kg → 1.4 J, 0.6 kg → 1.9 J, 0.8 kg → 2.5 J, 1.0 kg → 3.0 J. Whose conclusion is supported by the evidence?', 'Group B – the data increase steadily as the mass increases', [{t:'Group A – the numbers are all similar', why:'The work done more than doubles from 1.4 J to 3.0 J, so mass clearly has an effect.'}, {t:'Neither – four results are not enough for any conclusion', why:'There is a clear trend; a limited number of points means the conclusion should be cautious, not impossible.'}, {t:'Both – they are looking at the same data', why:'The conclusions contradict each other. Only one fits.'}], {explain:'Always compare your conclusion with the actual data.'});

/* ============ ENGINEERING ============ */
G.busMoments = r => {
  const nL = int(r, 3, 5), nR = nL - pick(r, [1, 1, 2]), w = pick(r, [500, 700, 800]), d = pick(r, [2, 3]);
  return {type:'multi', prompt:`A bus is supported at its centre. <b>${nL} people</b> weighing ${w} N each stand <b>${d} m to the left</b> of the pivot. <b>${nR} people</b> weighing ${w} N each stand <b>${d} m to the right</b>. Ignore the weight of the bus.`,
    parts:[{type:'num', prompt:'Calculate the total anticlockwise moment.', answer:nL * w * d, unit:'Nm', unitChoices:UW, label:'Moment'}, {type:'num', prompt:'Calculate the total clockwise moment.', answer:nR * w * d, unit:'Nm', unitChoices:UW, label:'Moment'}, {type:'mcq', prompt:'Will the bus balance?', options:['Yes, it balances', 'No – it turns clockwise ↻', 'No – it turns anticlockwise ↺'], answerFn: p => { const a = p[0], c = p[1]; return a === c ? 0 : (c > a ? 1 : 2); }}],
    steps:[`↺: ${nL} × ${w} = ${nL * w} N, then ${nL * w} × ${d} = <b>${nL * w * d} Nm</b>`, `↻: ${nR} × ${w} = ${nR * w} N, then ${nR * w} × ${d} = <b>${nR * w * d} Nm</b>`, `${nL * w * d} > ${nR * w * d}, so it turns anticlockwise ↺`]};
};
G.forearm = r => ({type:'explain', marks:2, prompt:'A human forearm is a third-class lever with a mechanical advantage below 1. Explain why the arm still uses this arrangement.',
  scheme:[{t:'The effort (muscle) is close to the pivot (elbow) so a small muscle movement…', kw:[['close', 'near', 'short']]}, {t:'…moves the hand a large distance / quickly (distance and speed are gained, but more force is needed)', kw:[['further', 'large', 'fast', 'speed', 'distance']]}],
  model:'The biceps is attached close to the elbow, so a small movement of the muscle moves the hand through a large distance and at high speed. The muscle needs a larger force than the load, but the arrangement gives movement and speed.', tip:'MA below 1 means distance/speed is gained instead of force.'});
G.longSpanner = r => ({type:'explain', marks:2, prompt:pick(r, ['A cyclist uses a wrench with a very long handle to loosen a rusty wheel nut. Explain why the long handle makes the nut easier to turn.', 'A gardener uses long-handled loppers to cut a thick branch. Explain why long handles make the job easier.', 'A plumber slides a long pipe over a short wrench to loosen a stiff joint. Explain why this helps.']),
  scheme:[{t:'The force is applied further from the pivot (larger perpendicular distance)', kw:[['further', 'longer', 'bigger', 'greater', 'more']]}, {t:'Moment = force × distance, so the same force gives a bigger moment (or less force is needed for the same moment)', kw:[['moment', 'turning effect'], ['force']]}],
  model:'A longer spanner puts the force further from the pivot (nut). The moment is force × perpendicular distance, so the same force produces a bigger moment, or less force is needed to produce the moment required to turn the nut.', tip:'Include the equation M = F × d and compare the two distances.'});
G.doorExplain = r => ({type:'explain', marks:2, prompt:'Door handles are fixed on the opposite edge from the hinge. Explain why this makes a door easier to open.',
  scheme:[{t:'The handle is far from the hinge (pivot), giving a large perpendicular distance', kw:[['far', 'further', 'distance', 'opposite']]}, {t:'So a small force produces a large moment / turning effect (M = F × d)', kw:[['moment', 'turning effect'], ['small', 'less', 'same']]}],
  model:'The handle is far from the hinge (pivot), so the perpendicular distance is large. A moment equals force × distance, so a small force gives a large turning effect and the door opens easily.', tip:'Use the words pivot, moment and perpendicular distance.'});
G.wheelbarrow = r => Q.mcq(r, 'The pivot of a wheelbarrow is the wheel’s axle. The load is in the tray between the axle and the handles, where you lift. What class of lever is it, and why?', 'Second class – the load is between the pivot and the effort', [{t:'First class – the pivot is between the load and the effort', why:'The pivot (axle) is at the end, not in the middle.'}, {t:'Third class – the effort is between the pivot and the load', why:'The effort (handles) is at the end furthest from the pivot.'}], {explain:'Load in the middle → second class. The effort arm is longer than the load arm so MA > 1.'});
G.pivotName = r => ({type:'fill', prompt:'What is the name of the pivot point of a lever? (one word)', accept:['fulcrum', 'pivot'], hint:'It begins with “f”.', explain:'The pivot of a lever is called the fulcrum.'});
G.eqWork = r => ({type:'fill', prompt:'Write the equation for work done (in words or symbols).', acceptRe:[/^(w|workdone|work)=(f|force)x(s|d|distance|displacement)$/, /^(w|workdone|work)=(f|force)\*(s|d|distance|displacement)$/, /^(w|workdone|work)=(s|d|distance)x(f|force)$/], hint:'Work done = force × distance moved in the direction of the force (W = F × s).', explain:'W = F × s'});
G.unitMoment = r => ({type:'fill', prompt:'State the unit of a moment.', accept:['Nm', 'N m', 'newton metre', 'newton metres', 'newton-metre', 'newton-metres', 'newtonmetre', 'newtonmetres'], hint:'It combines the units of force and distance.', explain:'newton-metre, Nm'});
G.unitPower = r => ({type:'fill', prompt:'State the unit of power (name or symbol).', accept:['W', 'watt', 'watts', 'J/s', 'joule per second', 'joules per second'], hint:'Named after James Watt.', explain:'The watt (W): 1 W = 1 J/s.'});
G.eqPower = r => ({type:'fill', prompt:'Write the equation for power in terms of work done and time.', acceptRe:[/^(p|power)=(w|workdone|work|e|energy)\/(t|time)$/, /^(p|power)=(w|workdone|work|e|energy)÷(t|time)$/, /^(p|power)=(w|workdone|work|energy|e)dividedby(t|time)$/], hint:'Power = work done ÷ time.', explain:'P = W ÷ t'});
G.eqMoment = r => ({type:'fill', prompt:'Write the equation for the moment of a force (words or symbols).', acceptRe:[/^(m|moment)=(f|force)x(d|distance|perpendiculardistance)$/, /^(m|moment)=(f|force)\*(d|distance)$/, /^(m|moment)=(d|distance)x(f|force)$/], hint:'Moment = force × perpendicular distance.', explain:'M = F × d'});
G.defMoment = r => ({type:'explain', marks:1, prompt:'What is a moment?', scheme:[{t:'The turning effect of a force about a pivot', kw:[['turn'], ['force']]}], model:'A moment is the turning effect of a force about a pivot (M = F × d).', tip:'A moment is not a moment in time!'});
G.unitForce = r => ({type:'fill', prompt:'State the unit of force.', accept:['N', 'newton', 'newtons'], explain:'newton, N'});
G.unitEnergy = r => ({type:'fill', prompt:'State the unit of energy.', accept:['J', 'joule', 'joules'], explain:'joule, J'});
G.principle = r => Q.mcq(r, 'Which statement is the principle of moments?', 'For a balanced object, the total clockwise moment equals the total anticlockwise moment about the same pivot', [{t:'For a balanced object the clockwise force equals the anticlockwise force', why:'It is the <i>moments</i> that must be equal, not the forces.'}, {t:'The heavier side always goes down', why:'Distance matters too – a lighter weight further out can balance a heavier one.'}, {t:'Moment equals force divided by distance', why:'Moment = force × distance.'}], {explain:'Moments, not forces, must be equal for balance.'});
})();
</script>
<script>/* Helpers shared by the module definitions */
(function(){

M.row = (...cols) => '<div class="grid g2">' + cols.map(c => '<div>' + c + '</div>').join('') + '</div>';
M.key = (t, body) => `<div class="callout key"><b class="t">${t}</b>${body}</div>`;

<script>(function(){
const U = PA.util, G = PA.gen, D = PA.diag, W = PA.widgets, {S, card, eq, key, warn, info} = PA.mod;
PA.modules.push({
  id:1, title:'Forces and Energy', icon:'⚡', color:'var(--c1)', lessons:'Lessons 1–2',
  blurb:'Energy stores and transfers, forces, resultants and why rockets accelerate.',
  learn:[
    card('Energy stores and transfers', `<p>Energy is measured in <b>joules (J)</b>. It is kept in <b>stores</b> and moves between them along <b>pathways</b>.</p>
      <div class="stores">${['Kinetic', 'Gravitational potential', 'Elastic potential', 'Chemical', 'Nuclear', 'Thermal', 'Magnetic', 'Electrostatic'].map(s => '<span class="store">' + s + '</span>').join('')}</div>
      <p><b>Four pathways:</b> mechanically (by a force), electrically (by a current), by heating, and by radiation.</p>
      ${key('The big idea: energy is conserved', '<p>Energy cannot be created or destroyed. It is often <b>dissipated</b> to the thermal store of the surroundings, which makes it less useful. We do not say energy is “used up” or “wasted”.</p>')}`, el => W.energyExplorer(el)),
    card('Forces and movement', `<p>A <b>force</b> is a push or pull caused by an interaction between two objects. It is measured in <b>newtons (N)</b>. Forces are <b>vectors</b>: they have a size <i>and</i> a direction, so we draw them as arrows. A longer arrow means a bigger force.</p>
      <div class="grid g2"><div class="callout"><b class="t">Contact forces</b>push, pull, friction, tension, normal contact force</div><div class="callout"><b class="t">Non-contact forces</b>gravity, magnetic force, electrostatic force</div></div>
      <p>A force can change an object’s <b>speed</b> or <b>direction</b> (it accelerates), change its <b>shape</b>, or make it <b>turn</b>.</p>
      ${info('Mass vs weight', '<p><b>Mass</b> is the amount of matter in an object (kg). <b>Weight</b> is the force of gravity on that mass (N). Mass does not change from place to place; weight does.</p>')}`),
    card('Resultant force: balanced or unbalanced?', `<p>The <b>resultant force</b> is the single force that has the same effect as all the forces acting on an object combined. For forces along one line: add forces in the same direction, <b>subtract</b> forces in opposite directions.</p>
      ${M_two()}
      <p>Try it. Change the push and the friction and watch the arrows, the resultant and the motion.</p>`, el => W.forceLab(el, 'box')),
    card('Rocket acceleration', `<p>Two main forces act on a rocket: <b>thrust</b> upwards from the engines and <b>weight</b> downwards.</p>
      <ul class="tick"><li>Thrust = weight: balanced, resultant 0. No acceleration. (The rocket stays on the pad, or moves at constant velocity.)</li><li>Thrust &gt; weight: resultant force upwards. The rocket <b>accelerates upwards</b>.</li><li>Thrust &lt; weight: resultant force downwards. It cannot lift off.</li></ul>
      <p>The energy comes from the <b>chemical store</b> of the fuel, transferred <b>mechanically</b> to the kinetic and gravitational potential stores (with some dissipated to thermal stores).</p>`, el => W.forceLab(el, 'rocket'))
  ],
  watch(el, done){
    const r = U.rng(2024), T = 150, Wt = 90;
    W.stepper(el, [
      {title:'On the launch pad', html:`<p>The rocket’s fuel is in its <b>chemical store</b>. The rocket is stationary, so its kinetic store is empty. Weight acts downwards and the pad pushes up – the forces are balanced.</p>` + D.forceDiagram([{dir:'up', mag:Wt, label:'support ' + Wt + ' kN'}, {dir:'down', mag:Wt, label:'weight ' + Wt + ' kN'}], {name:'rocket', unit:'kN'})},
      {title:'Engines ignite: draw the forces', html:`<p>Thrust is <b>${T} kN</b> upwards and weight is <b>${Wt} kN</b> downwards.</p>` + D.forceDiagram([{dir:'up', mag:T, label:'thrust ' + T + ' kN'}, {dir:'down', mag:Wt, label:'weight ' + Wt + ' kN'}], {name:'rocket', unit:'kN'})},
      {title:'Find the resultant', html:`<p>Forces in opposite directions, so subtract: <b>${T} − ${Wt} = ${T - Wt} kN upwards</b>.</p>${key('Unbalanced', '<p>A non-zero resultant force means the rocket <b>accelerates</b> in the direction of the resultant – upwards.</p>')}`},
      {title:'Track the energy', html:`<p>Chemical store (fuel) <span class="hl">decreases</span>. Energy is transferred <b>mechanically</b> by the thrust force to:</p><ul class="tick"><li>the kinetic store of the rocket (it speeds up)</li><li>the gravitational potential store (it climbs)</li><li>thermal stores of the engine, exhaust gases and surroundings (dissipated)</li></ul>`},
      {title:'Check: is energy conserved?', html:`<p>Yes. Total energy before = total energy after. The thermal energy is not lost – it is dissipated into the surroundings where it is hard to use again.</p><p>You are ready to practise!</p>`}
    ], {onComplete:done});
  },
  practise:[
    S('m1.p1', 'energy', 'AO1', G.energyStore),
    S('m1.p2', 'energy', 'AO1', G.energyPathway),
    S('m1.p3', 'forces', 'AO2', G.resultant2),
    S('m1.p4', 'forces', 'AO2', G.diagramMotion),
    S('m1.p5', 'forces', 'AO2', G.balancedMotion),
    S('m1.p6', 'forces', 'AO2', G.rocketResultant)
  ],
  challenge:[
    S('m1.c1', 'forces', 'AO3', G.thrustLess),
    S('m1.c2', 'forces', 'AO2', G.rocketWhy),
    S('m1.c3', 'forces', 'AO3', G.unknownForce),
    S('m1.c4', 'energy', 'AO3', G.energyExplain)
  ],
  master:[
    S('m1.m1', 'energy', 'AO1', G.energyStore), S('m1.m2', 'energy', 'AO1', G.energyPathway), S('m1.m3', 'energy', 'AO2', G.energyConserve),
    S('m1.m4', 'forces', 'AO2', G.resultant2), S('m1.m5', 'forces', 'AO2', G.balancedMotion), S('m1.m6', 'forces', 'AO2', G.rocketResultant),
    S('m1.m7', 'forces', 'AO3', G.unknownForce), S('m1.m8', 'forces', 'AO2', G.rocketWhy)
  ]
});
function M_two(){ return `<div class="grid g2"><div>${D.forceDiagram([{dir:'right', mag:40}, {dir:'left', mag:40}], {name:'box'})}<p class="small">Equal and opposite: resultant <b>0 N</b> – balanced. No change in motion.</p></div><div>${D.forceDiagram([{dir:'right', mag:50}, {dir:'left', mag:20}], {name:'box'})}<p class="small">50 − 20 = <b>30 N to the right</b> – unbalanced. It accelerates right.</p></div></div>`; }
})();
</script>
<script>(function(){
const U = PA.util, G = PA.gen, D = PA.diag, W = PA.widgets, {S, card, eq, key, warn, info} = PA.mod;
const sofa = r => ({type:'explain', marks:3, prompt:'A person pushes a sofa at a steady speed across a carpet. Describe the energy transfer and explain what has happened to the energy.',
  scheme:[{t:'The pushing force causes displacement, so energy is transferred mechanically (work is done)', kw:[['mechanical', 'work', 'force']]}, {t:'Friction acts against the motion', kw:[['friction']]}, {t:'The energy is dissipated to the thermal store of the sofa, carpet and surroundings (not kinetic, because the speed is steady)', kw:[['thermal', 'heat']]}],
  model:'The person’s pushing force does work: energy is transferred mechanically. Because the sofa moves at a steady speed, its kinetic store does not change – the work done against friction is dissipated to the thermal stores of the sofa, carpet and surroundings.', tip:'Steady speed means no gain in kinetic energy – so where does the energy go?'});
PA.modules.push({
  id:2, title:'Mechanical Work', icon:'🏗️', color:'var(--c2)', lessons:'Lessons 2–3',
  blurb:'Work done is energy transferred by a force: W = F × s.',
  learn:[
    card('What is mechanical work?', `<p>Think about holding, lifting and pushing. In which is energy transferred to the object?</p>
      <ul class="tick"><li><b>Force, but no displacement</b> (holding a bag still, pushing a wall): <b>no work done</b>, W = 0 J.</li><li><b>Force that causes displacement</b> (lifting, pushing a box): energy is transferred mechanically.</li></ul>
      ${key('Definition', '<p><b>Work done</b> is the amount of energy transferred mechanically by a force when it moves an object in the direction of the force. Work done and energy are both measured in joules (J).</p>')}
      ${warn('Tired ≠ work', '<p>Feeling tired holding a heavy bag is not evidence of work done <i>on the bag</i>. If the bag does not move, W = F × 0 = 0 J.</p>')}
      <p>Experiment: tick “against a wall” and watch what happens to the work done.</p>`, el => W.workLab(el)),
    card('The equation W = F × s', `<p>${eq('W = F × s', 'work done = force × distance moved')}</p>
      <div class="grid g3"><div class="callout"><b class="t">W</b>work done in <b>joules (J)</b></div><div class="callout"><b class="t">F</b>force in <b>newtons (N)</b></div><div class="callout"><b class="t">s</b>distance moved in the direction of the force, in <b>metres (m)</b></div></div>
      <p>1 joule is the work done when a force of 1 N moves an object 1 m. Distance means distance moved <i>in the direction of the force</i>.</p>
      ${info('Worked example', '<p>A student pushes a box with 30 N for 6 m.<br>W = F × s = 30 × 6 = <b>180 J</b></p>')}`),
    card('Unit conversions', `<p>The equation only works with <b>N</b> and <b>m</b>. Convert first!</p>
      <ul class="tick"><li>cm → m: divide by 100 (250 cm = 2.5 m)</li><li>kN → N: multiply by 1000 (5 kN = 5000 N)</li></ul>
      <p>Try the converter:</p>`, el => W.unitConverter(el)),
    card('Rearranging the equation', `<p>Cover the quantity you want to find:</p><div class="grid g2"><div>${PA.mod.triangle('W', 'F', 's', 'Triangle: work done on top, force and distance below')}</div><div>
      <p>${eq('F = W ÷ s')}</p><p>${eq('s = W ÷ F')}</p>
      ${info('Example', '<p>A force does 600 J of work moving a trolley 12 m. F = W ÷ s = 600 ÷ 12 = <b>50 N</b>.</p>')}</div></div>`)
  ],
  watch(el, done){
    const r = U.rng(77); const F = 45, cm = 240;
    W.stepper(el, [
      {title:'The problem', html:`<p>A caretaker pushes a trolley with a force of <b>${F} N</b> through <b>${cm} cm</b>. Calculate the work done in joules.</p>` + D.svg(520, 120, `<rect x="0" y="90" width="520" height="30" fill="var(--card)"/><rect x="170" y="45" width="70" height="45" rx="6" fill="var(--card2)" stroke="var(--text)" stroke-width="3"/>` + D.arrow(100, 68, 166, 68, 'var(--c5)', 6) + `<text x="100" y="56" class="lbl">${F} N</text><text x="260" y="112" class="lbl">moves ${cm} cm →</text>`, 'Trolley pushed with 45 newtons')},
      {title:'List what you know', html:`<p>F = ${F} N and s = ${cm} cm.</p><p class="small">Spot the trap: the distance is in <b>centimetres</b>.</p>`},
      {title:'Convert the unit', html:`<p>${cm} cm ÷ 100 = <b>${cm / 100} m</b></p>`},
      {title:'Write the equation and substitute', html:`<p>${eq('W = F × s')}</p><p>W = ${F} × ${cm / 100}</p>`},
      {title:'Calculate and state the unit', html:`<p>W = <b>${U.n(F * cm / 100)} J</b></p>${key('Check', '<p>Joules for work done. If you wrote N or Nm, check the quantity: N is force and Nm is a moment.</p>')}`}
    ], {onComplete:done});
  },
  practise:[
    S('m2.p1', 'work', 'AO1', G.workDo),
    S('m2.p2', 'work', 'AO2', r => G.workFindW(r, 1), {skill:'work'}),
    S('m2.p3', 'work', 'AO2', G.workFindF, {skill:'work'}),
    S('m2.p4', 'work', 'AO2', G.workFindS, {skill:'work'}),
    S('m2.p5', 'work', 'AO2', G.workCm, {skill:'work'}),
    S('m2.p6', 'work', 'AO2', G.workKN, {skill:'work'})
  ],
  practiseExtra(el){
    W.calcLab(el, {title:'Calculation generator – work done', topic:'work', skill:'work', intro:'Unlimited fresh questions in three levels. Great for building speed. (No extra XP here – XP comes from the question list.)',
      levels:[{name:'Level 1 – Easy', gen: r => G.workFindW(r, 1)}, {name:'Level 2 – Medium', gen: r => U.pick(r, [() => G.workFindW(r, 2), G.workFindF.bind(null, r), G.workFindS.bind(null, r)])()}, {name:'Level 3 – Hard', gen: r => U.pick(r, [G.workCm, G.workKN, G.workLift])(r)}]});
  },
  challenge:[
    S('m2.c1', 'work', 'AO2', G.workLift, {skill:'work'}),
    S('m2.c2', 'work', 'AO3', G.workExplain),
    S('m2.c3', 'work', 'AO2', G.workKN, {skill:'work'}),
    S('m2.c4', 'work', 'AO3', sofa)

<script>(function(){
const U = PA.util, G = PA.gen, D = PA.diag, W = PA.widgets, Q = PA.Q, {S, card, eq, key, warn, info} = PA.mod;
/* seesaw puzzles as widget questions */
function nice(r){ for (let i = 0; i < 200; i++) { const F1 = U.step(r, 20, 100, 10), d1 = U.pick(r, [1, 1.5, 2, 2.5, 3]), d2 = U.pick(r, [0.5, 1, 1.5, 2, 2.5, 3]), M = F1 * d1, F2 = M / d2; if (Number.isInteger(F2) && F2 !== F1 && F2 >= 10 && F2 <= 150) return {F1, d1, F2, d2}; } return {F1:60, d1:1, F2:30, d2:2}; }
const puzzle1 = r => { const c = nice(r); return {type:'widget', prompt:`Balance the seesaw. A <b>${c.F1} N</b> weight is fixed <b>${c.d1} m</b> to the left of the pivot. Place the <b>${c.F2} N</b> weight on the beam so that it balances. Calculate first, then release the beam!`, mount(el, api){
  W.seesaw(el, {title:'Seesaw puzzle', items:[{F:c.F1, x:-c.d1, fixed:true}, {F:c.F2}], showLive:false, requireAllPlaced:true, predict:false,
    onRelease(st){ if (st.result === 'bal') api.attempt(true, `<b class="t">Balanced!</b> ${c.F1} × ${c.d1} = ${U.n(c.F1 * c.d1)} Nm and ${c.F2} × ${c.d2} = ${U.n(c.F2 * c.d2)} Nm.`); else api.attempt(false, `<b class="t">Not balanced.</b> The beam turned ${st.result === 'cw' ? 'clockwise ↻' : 'anticlockwise ↺'} (${U.n(st.acw)} Nm ↺ vs ${U.n(st.cw)} Nm ↻). Calculate the distance you need: d = M ÷ F, then press “Hold level again” and move the weight.`); }}); } }; };
const puzzle2 = r => { for (let i = 0; i < 100; i++) { const Fa = U.step(r, 20, 60, 20), Fb = U.step(r, 10, 40, 10), xa = U.pick(r, [1, 1.5, 2]), xb = U.pick(r, [2.5, 3, 3.5]); const M = Fa * xa + Fb * xb; const d1 = U.pick(r, [1, 2, 2.5, 3]); const F1 = M / d1; if (Number.isInteger(F1) && F1 >= 20) return {type:'widget', prompt:`<b>Challenge.</b> A <b>${F1} N</b> weight is fixed <b>${d1} m</b> to the left. Place BOTH the <b>${Fa} N</b> and <b>${Fb} N</b> weights on the right-hand side so that the beam balances. (Distances must be multiples of 0.5 m.)`, mount(el, api){

  model:'The seesaw balances when the total clockwise moment equals the total anticlockwise moment. Moment = force × distance. The lighter child has a smaller force but sits further from the pivot, so both moments can be equal.', tip:'Mention “moment” and “distance” – not just that one child is heavier.'});

  learn:[
    card('The principle of moments', `<p>A beam turns if one moment is bigger than the other. It <b>balances</b> when the two are equal.</p>
      ${key('Principle of moments', '<p>For an object that is balanced, the <b>total clockwise moment about a pivot = the total anticlockwise moment about the same pivot</b>.</p>')}

      {title:'Try it yourself', html:`<p>Use the lever lab to reproduce this: put the load at 20, pivot at 40 and effort at 100 (units are cm), load force 300 N.</p><div id="watchlab"></div>`, onShow(st){ const h = st.querySelector('#watchlab'); if (h && !h.dataset.done) { h.dataset.done = 1; W.leverLab(h); } }}

  model:'The driving force is greater than the resistive forces, so there is a resultant (unbalanced) force in the forward direction. A resultant force causes acceleration in the direction of the resultant.', tip:'Name the two opposing forces, say which is bigger, then link to resultant force.'});

<script>/* Bilingual support: English stays on screen and a translation is shown underneath.
   Packs (es.js, th.js) register with PA.i18n.add(code, pack). Pack shape:
   { name, ui:{English text: translation}, terms:[[English term, translation]], mod:{id:{t,b,l}}, gloss:{Term:[translatedTerm, translatedDef]}, learn:{'m1.l0':{t,h}} } */
(function(){
const I = PA.i18n = {packs:{}, lang:'en'};
const KEY = '9p1academy.lang';
I.add = (code, pack) => { I.packs[code] = pack; };
I.pack = () => I.packs[I.lang] || null;
I.set = function(code){
  I.lang = I.packs[code] ? code : 'en';
  try { localStorage.setItem(KEY, I.lang); } catch (e) {}
  document.documentElement.setAttribute('data-bilingual', I.lang);
  document.querySelectorAll('.tr').forEach(n => n.remove());
  document.querySelectorAll('[data-tr]').forEach(n => n.removeAttribute('data-tr'));
  if (PA.route) PA.route(); else I.decorate(document.body);
};
const strip = s => s.replace(/\s+/g, ' ').replace(/^[^A-Za-z0-9(]+/, '').replace(/[:\s]+$/, '').trim();
const mk = (txt, lang, cls) => { const s = document.createElement('span'); s.className = 'tr' + (cls ? ' ' + cls : ''); s.lang = lang; s.textContent = txt; return s; };
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
let termRes = null, termFor = null;
function termList(p){
  if (termFor !== I.lang) { termFor = I.lang; termRes = p.terms.slice().sort((a, b) => b[0].length - a[0].length).map(t => [new RegExp('\\b' + esc(t[0]) + '(?:s|es)?\\b', 'i'), t]); }
  return termRes;
}
I.hint = function(text, p){
  const found = [], seen = new Set(); let rest = ' ' + text.toLowerCase() + ' ';
  termList(p).forEach(([re, t]) => { if (!seen.has(t[1]) && re.test(rest)) { seen.add(t[1]); found.push(t[0] + ' = ' + t[1]); rest = rest.replace(re, ' '); } });
  return found.slice(0, 8);
};
I.decorate = function(root){
  const p = I.pack(); if (!p || !root) return;
  const skip = 'svg,script,style,input,textarea,select,option,.tr,[data-notr],.eq,code';
  root.querySelectorAll('h1,h2,h3,h4,p,li,td,th,button,a,label,b,span,div,summary,legend,small').forEach(el => {
    if (el.closest(skip) || el.closest('select')) return;
    if (el.classList.contains('prompt') || el.classList.contains('step')) {
      if (el.dataset.hint !== I.lang) { el.dataset.hint = I.lang; const f = I.hint(el.textContent, p); if (f.length) { const d = mk('🌐 ' + f.join(' · '), I.lang, 'hint'); el.append(d); } }
      return;
    }
    if ([...el.children].some(c => !c.classList.contains('tr') && c.tagName !== 'B' && c.tagName !== 'I' && c.tagName !== 'SMALL' && c.tagName !== 'SPAN')) return;
    const own = [...el.childNodes].filter(n => n.nodeType === 3).map(n => n.nodeValue).join('');
    const en = strip(own);
    if (!en || el.dataset.tr === en) return;
    const old = el.querySelector(':scope > .tr:not(.hint):not(.static)'); if (old) old.remove();
    el.dataset.tr = en;
    const t = p.ui[en]; if (t) el.append(mk(t, I.lang));
  });
};
I.mod = (id, f) => { const p = I.pack(); const m = p && p.mod && p.mod[id]; return m ? m[f] : ''; };
I.trLine = (id, f, tag) => { const t = I.mod(id, f); if (!t) return ''; const e = document.createElement(tag || 'div'); e.className = 'tr static'; e.lang = I.lang; e.textContent = t; return e; };
I.learn = function(id, i){
  const p = I.pack(), c = p && p.learn && p.learn['m' + id + '.l' + i]; if (!c) return null;
  const d = document.createElement('div'); d.className = 'tr learnblock'; d.lang = I.lang;
  d.innerHTML = '<h3>🌐 ' + c.t + '</h3>' + c.h; return d;
};
I.gloss = term => { const p = I.pack(); return p && p.gloss ? p.gloss[term] : null; };
I.init = function(){
  let saved = 'en'; try { saved = localStorage.getItem(KEY) || 'en'; } catch (e) {}
  I.lang = I.packs[saved] ? saved : 'en';
  document.documentElement.setAttribute('data-bilingual', I.lang);
  const nav = document.querySelector('nav.main');
  if (nav) {
    const sel = document.createElement('select'); sel.id = 'langsel'; sel.setAttribute('aria-label', 'Language / Idioma / ภาษา'); sel.title = 'Language / Idioma / ภาษา';
    [['en', 'English'], ...Object.keys(I.packs).map(k => [k, 'English + ' + I.packs[k].name])].forEach(([v, l]) => { const o = document.createElement('option'); o.value = v; o.textContent = l; if (v === I.lang) o.selected = true; sel.append(o); });
    sel.addEventListener('change', () => I.set(sel.value)); nav.prepend(sel);
  }
  let sched = false;
  new MutationObserver(() => { if (sched || I.lang === 'en') return; sched = true; requestAnimationFrame(() => { sched = false; I.decorate(document.body); }); }).observe(document.body, {childList:true, subtree:true, characterData:true});
  I.decorate(document.body);
};
})();
</script>

learn:{
'm1.l0':{t:'Almacenes y transferencias de energía',h:'<p>La energía se mide en <b>julios (J)</b>. Se guarda en <b>almacenes</b> y pasa de uno a otro por <b>vías</b>.</p><p>Almacenes: cinético, potencial gravitatorio, potencial elástico, químico, nuclear, térmico, magnético y electrostático.</p><p>Cuatro vías: <b>mecánicamente</b> (por una fuerza), <b>eléctricamente</b> (por una corriente), por <b>calentamiento</b> y por <b>radiación</b>.</p><p><b>Idea clave: la energía se conserva.</b> No se crea ni se destruye. A menudo se <b>disipa</b> al almacén térmico del entorno, y así es menos útil. No decimos que la energía se “gasta” ni que se “desperdicia”.</p>'},
'm1.l1':{t:'Fuerzas y movimiento',h:'<p>Una <b>fuerza</b> es un empujón o tirón causado por la interacción entre dos objetos. Se mide en <b>newtons (N)</b>. Las fuerzas son <b>vectores</b>: tienen tamaño y dirección, por eso se dibujan como flechas. Una flecha más larga es una fuerza mayor.</p><ul><li><b>Fuerzas de contacto:</b> empuje, tracción, rozamiento, tensión, fuerza normal.</li><li><b>Fuerzas a distancia:</b> gravedad, fuerza magnética, fuerza electrostática.</li></ul><p>Una fuerza puede cambiar la rapidez o la dirección de un objeto (acelerarlo), cambiar su forma o hacerlo girar.</p><p><b>Masa y peso:</b> la masa es la cantidad de materia (kg). El peso es la fuerza de la gravedad sobre esa masa (N). La masa no cambia de un lugar a otro; el peso sí.</p>'},
'm1.l2':{t:'Fuerza resultante: ¿equilibrada o no?',h:'<p>La <b>fuerza resultante</b> es la única fuerza que tiene el mismo efecto que todas las fuerzas que actúan sobre un objeto. En una sola línea: <b>suma</b> las fuerzas del mismo sentido y <b>resta</b> las de sentido contrario.</p><ul><li>Iguales y opuestas: resultante 0 N, <b>equilibradas</b>. No cambia el movimiento.</li><li>50 − 20 = 30 N a la derecha: <b>no equilibradas</b>. Acelera hacia la derecha.</li></ul>'},
'm1.l3':{t:'Aceleración del cohete',h:'<p>Sobre un cohete actúan dos fuerzas principales: el <b>empuje</b> hacia arriba de los motores y el <b>peso</b> hacia abajo.</p><ul><li>Empuje = peso: equilibradas, resultante 0. No hay aceleración.</li><li>Empuje &gt; peso: resultante hacia arriba. El cohete <b>acelera hacia arriba</b>.</li><li>Empuje &lt; peso: resultante hacia abajo. No puede despegar.</li></ul><p>La energía viene del <b>almacén químico</b> del combustible y se transfiere mecánicamente a los almacenes cinético y potencial gravitatorio (con una parte disipada a los almacenes térmicos).</p>'},
'm2.l0':{t:'¿Qué es el trabajo mecánico?',h:'<ul><li><b>Hay fuerza pero no hay desplazamiento</b> (sujetar una bolsa quieta, empujar una pared): <b>no se realiza trabajo</b>, W = 0 J.</li><li><b>La fuerza provoca desplazamiento</b> (levantar, empujar una caja): se transfiere energía mecánicamente.</li></ul><p><b>Definición:</b> el <b>trabajo realizado</b> es la cantidad de energía transferida mecánicamente por una fuerza cuando mueve un objeto en la dirección de la fuerza. Se mide en julios (J).</p><p><b>Cansado ≠ trabajo:</b> cansarte al sujetar una bolsa pesada no significa que hayas hecho trabajo <i>sobre la bolsa</i>. Si la bolsa no se mueve, W = F × 0 = 0 J.</p>'},
'm2.l1':{t:'La ecuación W = F × s',h:'<p><b>W = F × s</b> (trabajo realizado = fuerza × distancia recorrida)</p><ul><li><b>W</b>: trabajo realizado en <b>julios (J)</b></li><li><b>F</b>: fuerza en <b>newtons (N)</b></li><li><b>s</b>: distancia recorrida en la dirección de la fuerza, en <b>metros (m)</b></li></ul><p>1 julio es el trabajo realizado cuando una fuerza de 1 N mueve un objeto 1 m.</p><p><b>Ejemplo:</b> un estudiante empuja una caja con 30 N durante 6 m. W = F × s = 30 × 6 = <b>180 J</b>.</p>'},
'm2.l2':{t:'Conversión de unidades',h:'<p>La ecuación solo funciona con <b>N</b> y <b>m</b>. ¡Convierte primero!</p><ul><li>cm → m: divide entre 100 (250 cm = 2,5 m)</li><li>kN → N: multiplica por 1000 (5 kN = 5000 N)</li></ul>'},
'm2.l3':{t:'Despejar la ecuación',h:'<p>Tapa la magnitud que quieres hallar:</p><p><b>F = W ÷ s</b> &nbsp; y &nbsp; <b>s = W ÷ F</b></p><p><b>Ejemplo:</b> una fuerza realiza 600 J de trabajo al mover un carrito 12 m. F = W ÷ s = 600 ÷ 12 = <b>50 N</b>.</p>'},
'm3.l0':{t:'¿Qué es la potencia?',h:'<p>Dos trabajadores hacen el mismo trabajo (misma fuerza, misma distancia). A tarda 2 minutos y B tarda 6 minutos. ¿Tienen la misma <b>potencia</b>?</p><p><b>Potencia</b> es el ritmo al que se transfiere energía o se realiza trabajo. “Ritmo” significa “por segundo”.</p><ul><li><b>Trabajo / energía:</b> la cantidad total transferida. El tiempo no importa.</li><li><b>Potencia:</b> la rapidez con que se transfiere. El tiempo sí importa.</li></ul>'},
'm3.l1':{t:'P = W ÷ t y el vatio',h:'<p><b>P = W ÷ t</b> (potencia = trabajo realizado ÷ tiempo), o <b>P = E ÷ t</b>.</p><ul><li><b>P</b>: potencia en <b>vatios (W)</b></li><li><b>W</b> (o E): trabajo / energía en <b>julios (J)</b></li><li><b>t</b>: tiempo en <b>segundos (s)</b></li></ul><p>1 vatio = 1 julio por segundo (1 W = 1 J/s). Una lámpara de 60 W transfiere 60 J cada segundo. 1 kW = 1000 W.</p><p><b>Ejemplo:</b> un motor transfiere 1200 J en 8 s. P = 1200 ÷ 8 = <b>150 W</b>.</p>'},
'm3.l2':{t:'Despejar',h:'<p><b>W = P × t</b> &nbsp; y &nbsp; <b>t = W ÷ P</b></p><p><b>Ejemplo:</b> una bombilla de 40 W está encendida 30 s. W = P × t = 40 × 30 = <b>1200 J</b>.</p><p><b>Cuidado con las unidades:</b> ¡segundos, no minutos! Convierte 2 minutos a 120 s. Convierte kW a W (× 1000) antes de calcular en julios.</p>'},
'm3.l3':{t:'Comparar ritmos de transferencia de energía',h:'<p>Para decidir qué máquina es más potente, calcula la potencia de cada una y compáralas. No compares solo la energía ni solo el tiempo.</p><p>Máquina A: 2400 J en 8 s = 300 W. Máquina B: 1800 J en 5 s = 360 W.</p><p>B transfiere menos energía en total pero lo hace más rápido, así que B tiene <b>mayor potencia</b>.</p>'},
'm4.l0':{t:'Variables y una prueba justa',h:'<p>Investigación: “¿Cómo afecta la masa total de un bloque al trabajo realizado al arrastrarlo 1,0 m contra el rozamiento?”</p><ul><li><b>Variable independiente:</b> lo que cambias a propósito (masa total del bloque).</li><li><b>Variable dependiente:</b> lo que mides o calculas (trabajo realizado).</li><li><b>Variables de control:</b> lo que mantienes igual (distancia 1,0 m, superficie, cara del bloque, ángulo, rapidez, dinamómetro).</li></ul><p><b>Ojo:</b> lo que se mide es la fuerza de arrastre en newtons. El trabajo se <i>calcula</i> con la fuerza media y la distancia. Una prueba justa cambia solo la variable independiente y controla todo lo demás.</p>'},
'm4.l1':{t:'Repeticiones, medias y anomalías',h:'<p>Toma tres lecturas repetidas para cada masa, para poder detectar valores raros. Registra la fuerza cuando el bloque se mueve a rapidez constante (no el pico inicial).</p><p><b>media = suma de lecturas ÷ número de lecturas.</b> Ejemplo: 1,4 N, 1,5 N, 1,4 N → 4,3 ÷ 3 = 1,43… → 1,4 N (redondea a la precisión del dinamómetro).</p><p><b>Anomalías:</b> un resultado que no encaja con el patrón de sus repeticiones. Nunca lo borres automáticamente. Guarda la lectura, investiga, repite la medida si puedes y exclúyela de la media solo si hay una razón científica.</p>'},
'm4.l2':{t:'Calcular el trabajo y dibujar la gráfica',h:'<p>Con una distancia de exactamente 1,0 m, W = F × s da el mismo número para la fuerza y el trabajo, pero la fuerza está en N y el trabajo en J.</p><p>Representa la masa total en el eje x (independiente) y el trabajo realizado en el eje y (dependiente). Dibuja una <b>línea de mejor ajuste</b>: una línea suave con los puntos repartidos a ambos lados, no unidos punto a punto.</p><p>Patrón: al aumentar la masa total, aumenta el trabajo realizado. La línea no pasa por el origen, así que no podemos decir “directamente proporcional”.</p>'},
'm4.l3':{t:'Evaluar las pruebas',h:'<ul><li><b>Fiable:</b> ¿se pueden repetir los resultados? Mejora con más repeticiones y una media.</li><li><b>Válido:</b> ¿es una prueba justa que mide lo que dice? Mejora controlando las variables.</li><li><b>Preciso:</b> ¿con qué finura mide el instrumento? Un dinamómetro de 0,05 N es más preciso que uno de 0,1 N.</li></ul><p>Una buena evaluación incluye una mejora concreta, por qué ayuda y una limitación específica. <b>Conclusión:</b> describe el patrón, usa datos de tu tabla y no afirmes más de lo que muestran los datos.</p>'},
'm5.l0':{t:'Pivote y efecto de giro',h:'<p>Una fuerza puede hacer que un objeto <b>gire</b>. Puertas, llaves inglesas, balancines y palancas giran alrededor de un punto fijo.</p><ul><li><b>Pivote:</b> el punto fijo alrededor del cual gira un objeto.</li><li><b>Efecto de giro:</b> cuánto hace girar una fuerza a un objeto alrededor de un pivote.</li><li><b>Momento:</b> el nombre científico del efecto de giro de una fuerza. (¡No es un momento en el tiempo!)</li></ul><p>¿Por qué el picaporte está en el borde opuesto a las bisagras? Empujar lejos del pivote da un efecto de giro mucho mayor con la misma fuerza.</p><p><b>Sentido horario ↻</b>: el mismo sentido que las agujas del reloj. <b>Sentido antihorario ↺</b>: el contrario. Una fuerza hacia abajo a la derecha del pivote es horaria; a la izquierda, antihoraria.</p>'},
'm5.l1':{t:'Línea de acción y distancia perpendicular',h:'<p>La <b>línea de acción</b> es la línea recta a lo largo de la cual actúa una fuerza, prolongada en ambos sentidos. La <b>distancia perpendicular</b> es la distancia más corta del pivote a la línea de acción, medida a <b>90°</b>.</p><p><b>¡No siempre es la longitud de la llave!</b> Si la línea de acción de una fuerza pasa por el pivote, la distancia perpendicular es 0 y el momento es <b>0</b>.</p>'},
'm5.l2':{t:'La ecuación del momento M = F × d',h:'<p><b>M = F × d</b> (momento = fuerza × distancia perpendicular)</p><ul><li><b>M</b>: momento en newton-metros (<b>Nm</b>)</li><li><b>F</b>: fuerza en newtons (N)</li><li><b>d</b>: distancia perpendicular en metros (m)</li></ul><p><b>Nm no es J:</b> un momento se mide en Nm pero no es una energía. Usa J para el trabajo realizado y Nm para los momentos. Indica siempre el sentido (↻ o ↺).</p>'},
'm5.l3':{t:'Despejar y convertir cm a m',h:'<p><b>F = M ÷ d</b> &nbsp; y &nbsp; <b>d = M ÷ F</b></p><p><b>Ejemplo:</b> una tuerca necesita un momento de 6,0 Nm. La llave mide 0,15 m: F = 6,0 ÷ 0,15 = <b>40 N</b>. Con una llave de 0,30 m solo hacen falta 20 N.</p><p>Convierte cm a m primero: 35 cm ÷ 100 = 0,35 m.</p>'},
'm6.l0':{t:'El principio de los momentos',h:'<p>Una viga gira si un momento es mayor que el otro. Se equilibra cuando son iguales.</p><p><b>Principio de los momentos:</b> en un objeto equilibrado, el momento <b>horario</b> total respecto a un pivote = el momento <b>antihorario</b> total respecto al mismo pivote.</p><p>Ejemplo: ↺ 60 × 1,0 = 60 Nm y ↻ 40 × 1,5 = 60 Nm → <b>equilibrado</b>, aunque las fuerzas sean distintas.</p><p><b>Compara momentos, no fuerzas.</b> Fuerzas iguales no garantizan equilibrio, y fuerzas distintas pueden equilibrarse.</p>'},
'm6.l1':{t:'Totales con varias fuerzas',h:'<p>Suma los momentos de cada lado <b>por separado</b>. Nunca sumes momentos horarios y antihorarios juntos.</p><p>↺: 20 × 3 + 50 × 1 = 110 Nm. ↻: 60 × 2 = 120 Nm. Como 120 &gt; 110, la viga gira en sentido <b>horario</b>.</p><p><b>¿Misma posición? Suma primero las fuerzas.</b> 4 personas de 600 N a 2 m del pivote: fuerza total = 4 × 600 = 2400 N, momento = 2400 × 2 = 4800 Nm. (¡No 600 × 2!)</p>'},
'm6.l2':{t:'Hallar una fuerza desconocida',h:'<p>Un peso de 60 N está a 1,0 m a la izquierda. ¿Qué peso debe estar a 1,5 m a la derecha para equilibrar?</p><p>Momento antihorario = 60 × 1,0 = 60 Nm. En equilibrio, momento horario = 60 Nm. F × 1,5 = 60, así que F = 60 ÷ 1,5 = <b>40 N</b>.</p>'},
'm6.l3':{t:'Hallar una distancia desconocida',h:'<p>Un peso de 30 N está a 0,8 m a la izquierda. A la derecha hay un peso de 60 N. ¿Dónde debe estar?</p><p>↺ = 30 × 0,8 = 24 Nm. 60 × d = 24, así que d = 24 ÷ 60 = <b>0,4 m</b>.</p><p>Si las distancias están en cm, conviértelas a m (o déjalas todas en cm, pero sé coherente).</p>'},
'm7.l0':{t:'Partes de una palanca: fulcro, esfuerzo, carga',h:'<p>Una <b>palanca</b> es un objeto rígido que gira alrededor de un pivote, llamado <b>fulcro</b>.</p><ul><li><b>Fulcro:</b> el punto alrededor del cual gira.</li><li><b>Esfuerzo:</b> la fuerza que aplicas.</li><li><b>Carga:</b> la fuerza que se vence (por ejemplo, un peso).</li><li><b>Brazo del esfuerzo / brazo de la carga:</b> distancias perpendiculares del pivote a cada fuerza.</li></ul><p>En equilibrio: <b>esfuerzo × brazo del esfuerzo = carga × brazo de la carga</b>.</p>'},
'm7.l1':{t:'Tres clases de palanca',h:'<p>Lo que está en el medio da nombre a la clase. Recuerda <b>F-C-E = 1-2-3</b>: Fulcro en el medio = 1.ª clase, Carga = 2.ª clase, Esfuerzo = 3.ª clase.</p><ul><li><b>1.ª clase:</b> balancín, tijeras, palanca de hierro.</li><li><b>2.ª clase:</b> carretilla, cascanueces, abrebotellas.</li><li><b>3.ª clase:</b> pinzas, antebrazo humano.</li></ul><p><b>La carretilla:</b> el pivote es el eje de la rueda, la carga está en la caja entre el eje y las asas, y el esfuerzo está en las asas. La carga está en el medio, así que es una palanca de <b>2.ª clase</b>. Unas asas más largas dan un brazo del esfuerzo mayor, y hace falta menos esfuerzo.</p>'},
'm7.l2':{t:'Ventaja mecánica',h:'<p><b>VM = carga ÷ esfuerzo</b> &nbsp; y, en una palanca ideal, &nbsp; <b>VM = brazo del esfuerzo ÷ brazo de la carga</b>. La VM es una razón, <b>no tiene unidad</b>.</p><ul><li><b>VM &gt; 1:</b> la fuerza se multiplica (poco esfuerzo, carga grande); el esfuerzo se mueve más.</li><li><b>VM = 1:</b> no hay ganancia de fuerza.</li><li><b>VM &lt; 1:</b> se gana distancia y rapidez (p. ej., el antebrazo), pero hace falta más esfuerzo.</li></ul><p><b>Por qué ayudan las palancas largas:</b> cuanto mayor es el brazo del esfuerzo respecto al brazo de la carga, mayor es la VM.</p>'},
'm7.l3':{t:'Intercambio fuerza–distancia',h:'<p>Una máquina no crea energía: <b>intercambia fuerza por distancia</b>.</p><p>Palanca: esfuerzo de 100 N baja 0,30 m; carga de 300 N sube 0,10 m (VM = 3). Trabajo de entrada = 100 × 0,30 = <b>30 J</b>. Trabajo de salida = 300 × 0,10 = <b>30 J</b>. Iguales en una palanca ideal.</p><p>Las máquinas reales tienen rozamiento: parte de la energía se disipa al almacén térmico y el trabajo útil de salida es menor que el de entrada.</p>'},
'm7.l4':{t:'Ingeniería y estabilidad',h:'<p>Los ingenieros usan los momentos para mantener estables estructuras y vehículos: las grúas usan contrapesos, los puentes se construyen por igual a ambos lados de un pilar, y la carga de un remolque no debe poner demasiado momento detrás del eje.</p><p>En el reto del autobús modelas el autobús como una viga rígida sobre un pivote, con cargas puntuales. Para demostrar que es estable, calcula los momentos horario y antihorario totales y muestra que son iguales.</p><p><b>Los modelos tienen límites:</b> las masas reales están repartidas, la carrocería tiene su propio peso, los apoyos tienen rozamiento, las estructuras se doblan y los pasajeros se mueven. Di siempre qué ignora tu modelo.</p>'},
'm8.l0':{t:'Cómo funciona la evaluación',h:'<p>Las preguntas evalúan tres habilidades (objetivos de evaluación):</p><ul><li><b>AO1 – Conocimiento:</b> indica, nombra, escribe la ecuación, da la unidad, define.</li><li><b>AO2 – Aplicación:</b> calcula con una ecuación; explica una situación con ideas científicas.</li><li><b>AO3 – Análisis y evaluación:</b> determina, interpreta datos, justifica una conclusión, explica diseños reales.</li></ul><p>Mira los puntos: 2 puntos ≈ 2 ideas o pasos distintos. Un cálculo de 2 puntos suele dar 1 punto por el método/número y 1 punto por la unidad correcta.</p>'},
'm8.l1':{t:'Palabras de mando',h:'<ul><li><b>State / Name (indica / nombra):</b> da un dato breve. No hace falta explicar.</li><li><b>Calculate (calcula):</b> usa una ecuación. Escribe la ecuación, sustituye y da la respuesta con su <b>unidad</b>.</li><li><b>Determine (determina):</b> averígualo con la información dada, mostrando la comparación (por ejemplo, ambos momentos).</li><li><b>Explain (explica):</b> da una razón con “porque / así que”. Une causa y efecto con palabras científicas.</li><li><b>Describe (describe):</b> di qué ocurre, en orden.</li><li><b>Evaluate (evalúa):</b> pondera ventajas y limitaciones y llega a un juicio justificado.</li></ul>'},
'm8.l2':{t:'Tu caja de ecuaciones',h:'<ul><li>Trabajo realizado: <b>W = F × s</b> (J = N × m)</li><li>Potencia: <b>P = W ÷ t</b> (W = J ÷ s)</li><li>Momento: <b>M = F × d</b> (Nm = N × m)</li><li>Principio de los momentos: momento horario total = momento antihorario total</li><li>Ventaja mecánica: <b>VM = carga ÷ esfuerzo</b> = brazo del esfuerzo ÷ brazo de la carga (sin unidad)</li><li>Fuerza resultante: resta las fuerzas de sentido contrario; suma las del mismo sentido</li></ul><p>También puedes abrir “Herramientas” en el menú superior en cualquier momento.</p>'},
'm8.l3':{t:'Errores que cuestan puntos',h:'<ul><li>Olvidar la unidad (J para el trabajo, W para la potencia, Nm para los momentos, N para la fuerza).</li><li>No convertir cm → m o kN → N antes de calcular.</li><li>Usar el peso de una sola persona cuando varias están en el mismo sitio: combina primero las fuerzas.</li><li>Comparar fuerzas en vez de momentos para decidir si algo se equilibra.</li><li>Sumar juntos los momentos horarios y antihorarios.</li><li>Decir “no se usa energía” en vez de “no se transfiere energía”, o “la energía se desperdicia” en vez de “se disipa al almacén térmico”.</li><li>Escribir “las máquinas crean energía”: transfieren energía e intercambian fuerza por distancia.</li><li>Borrar los resultados anómalos en vez de investigarlos.</li></ul>'}
}
});
