<!DOCTYPE html>
<html lang="en-GB" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9P1 Work &amp; Moments Academy</title>
<meta name="description" content="Interactive Year 9 physics revision: work done, power, moments, levers and the scientific investigation.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffc933'/%3E%3Cpath d='M10 36 L54 24' stroke='%2312161d' stroke-width='6' stroke-linecap='round'/%3E%3Cpolygon points='32,32 22,52 42,52' fill='%2312161d'/%3E%3C/svg%3E">
<style>/* 9P1 Work & Moments Academy – workshop theme */
:root{
  --bg:#12161d; --bg2:#1a202b; --card:#1f2733; --card2:#273142; --line:#38445a;
  --text:#eef2f8; --muted:#a9b6cc; --accent:#ffc933; --accent-ink:#201700;
  --good:#46d9a0; --bad:#ff6b6b; --info:#5cc8ff; --warn:#ffb04a;
  --c1:#5cc8ff; --c2:#ff9f43; --c3:#ffd43b; --c4:#46d9a0; --c5:#ff6f9c; --c6:#a592ff; --c7:#3fd6d0; --c8:#ffc933;
  --radius:14px; --fs:1; --shadow:0 6px 0 rgba(0,0,0,.28);
  --head: "Trebuchet MS","Segoe UI","Avenir Next",system-ui,sans-serif;
  --body: "Segoe UI","Avenir Next",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
:root[data-theme="light"]{
  --bg:#f3efe6; --bg2:#e9e3d4; --card:#fffdf8; --card2:#f3eddd; --line:#cfc6b0;
  --text:#1b2330; --muted:#566178; --accent:#e89a00; --accent-ink:#1b1200;
  --good:#0d8f62; --bad:#c62f2f; --info:#0a6fb0; --warn:#b36200;
  --c1:#0a74b8; --c2:#d96a00; --c3:#a98300; --c4:#0d8f62; --c5:#c4306a; --c6:#6249d6; --c7:#0a8f8a; --c8:#b57d00;
  --shadow:0 5px 0 rgba(60,45,10,.16);
}
@media (prefers-color-scheme: light){
  :root[data-theme="auto"]{
    --bg:#f3efe6; --bg2:#e9e3d4; --card:#fffdf8; --card2:#f3eddd; --line:#cfc6b0;
    --text:#1b2330; --muted:#566178; --accent:#e89a00; --accent-ink:#1b1200;
    --good:#0d8f62; --bad:#c62f2f; --info:#0a6fb0; --warn:#b36200;
    --c1:#0a74b8; --c2:#d96a00; --c3:#a98300; --c4:#0d8f62; --c5:#c4306a; --c6:#6249d6; --c7:#0a8f8a; --c8:#b57d00;
    --shadow:0 5px 0 rgba(60,45,10,.16);
  }
}
*{box-sizing:border-box}
html{font-size:calc(100% * var(--fs))}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.55;min-height:100vh;
  background-image:linear-gradient(var(--bg2) 1px,transparent 1px),linear-gradient(90deg,var(--bg2) 1px,transparent 1px);
  background-size:28px 28px; background-attachment:fixed}
h1,h2,h3,h4{font-family:var(--head);line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.2rem}
p{margin:.5em 0 .8em;max-width:70ch}
a{color:var(--info)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus,main:focus{outline:none}
.sr{position:absolute;left:-9999px}
.skip{position:absolute;left:8px;top:-60px;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;z-index:100;font-weight:700}
.skip:focus{top:8px}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:2px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-family:var(--head);font-weight:800}
.brand svg{width:34px;height:34px}
.brand small{display:block;font-weight:600;color:var(--muted);font-size:.72rem;line-height:1}
nav.main{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.main a,nav.main button{background:none;border:0;color:var(--muted);font:inherit;font-weight:700;padding:8px 12px;border-radius:10px;cursor:pointer;text-decoration:none}
nav.main a:hover,nav.main button:hover,nav.main a[aria-current="page"]{background:var(--card);color:var(--text)}
.xpchip{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px;font-weight:700;font-size:.9rem}
.xpchip .lv{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 10px;font-weight:800}
.xpchip.pulse{animation:pulse .7s}
@keyframes pulse{40%{transform:scale(1.12);border-color:var(--accent)}}
main{max-width:1180px;margin:0 auto;padding:20px 16px 80px}
footer{max-width:1180px;margin:0 auto;padding:10px 16px 40px;color:var(--muted);font-size:.85rem}

/* cards, buttons */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.btn{font:inherit;font-weight:800;border:2px solid var(--line);background:var(--card2);color:var(--text);padding:9px 16px;border-radius:12px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25);transition:transform .08s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.good{background:var(--good);color:#04241a;border-color:var(--good)}
.btn.ghost{background:none;box-shadow:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:.85rem}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:.8rem;font-weight:700;color:var(--muted)}
.chip.ok{color:var(--good);border-color:var(--good)}

/* tape-measure progress */
.tape{height:26px;border-radius:6px;background:var(--accent);position:relative;overflow:hidden;border:2px solid var(--line);
  background-image:repeating-linear-gradient(90deg,transparent 0 9px,rgba(0,0,0,.35) 9px 10px),repeating-linear-gradient(90deg,transparent 0 49px,rgba(0,0,0,.6) 49px 51px)}
.tape.track{background-color:var(--card2);background-image:repeating-linear-gradient(90deg,transparent 0 9px,var(--line) 9px 10px),repeating-linear-gradient(90deg,transparent 0 49px,var(--muted) 49px 51px)}
.tape-wrap{position:relative}
.tape-fill{position:absolute;left:0;top:0;bottom:0;background-color:var(--accent);transition:width .8s cubic-bezier(.2,.8,.2,1);
  background-image:repeating-linear-gradient(90deg,transparent 0 9px,rgba(0,0,0,.3) 9px 10px),repeating-linear-gradient(90deg,transparent 0 49px,rgba(0,0,0,.55) 49px 51px)}
.tape-wrap{height:26px;border-radius:6px;overflow:hidden;border:2px solid var(--line);background:var(--card2)}
.bar{height:10px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good)}

/* hero */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:stretch}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.bignum{font-family:var(--head);font-size:3.4rem;font-weight:900;line-height:1;color:var(--accent)}
.hero-art{display:flex;align-items:center;justify-content:center}

/* module tiles */
.tile{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;border-top:8px solid var(--mc);cursor:pointer}
.tile:hover{transform:translateY(-3px)}
.tile .ic{font-size:1.8rem}
.pips{display:flex;gap:5px}
.pip{flex:1;height:8px;border-radius:4px;background:var(--card2);border:1px solid var(--line)}
.pip.on{background:var(--mc);border-color:var(--mc)}

/* module page */
.mhead{border-left:10px solid var(--mc);padding-left:14px;margin-bottom:12px}
.stages{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 18px}
.stage{flex:1;min-width:110px;text-align:center;text-decoration:none;font-weight:800;color:var(--muted);background:var(--card);border:2px solid var(--line);padding:10px 8px;border-radius:12px}
.stage[aria-current="step"]{background:var(--mc);color:#111;border-color:var(--mc)}
.stage.done::after{content:" ✓";color:var(--good)}
.stage[aria-current="step"].done::after{color:#111}

/* learn cards */
.callout{border-left:6px solid var(--info);background:var(--card2);padding:10px 14px;border-radius:8px;margin:12px 0}
.callout.key{border-color:var(--accent)}
.callout.warn{border-color:var(--warn)}
.callout b.t{display:block;font-family:var(--head)}
.eq{display:inline-block;font-family:var(--head);font-weight:900;font-size:1.5rem;background:var(--card2);border:2px dashed var(--accent);border-radius:12px;padding:6px 16px;margin:6px 0}
.eq small{font-size:.8rem;color:var(--muted);font-weight:600;margin-left:8px}
.tri{display:inline-block}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
ul.tick{list-style:none;padding:0}ul.tick li{padding-left:26px;position:relative;margin:.35em 0}
ul.tick li::before{content:"✔";position:absolute;left:0;color:var(--good)}
table.t{border-collapse:collapse;width:100%;margin:8px 0;font-size:.95rem}
table.t th,table.t td{border:1px solid var(--line);padding:6px 10px;text-align:center}
table.t th{background:var(--card2)}
table.t td.l{text-align:left}
.stores{display:flex;flex-wrap:wrap;gap:8px}
.store{background:var(--card2);border:2px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:700}

/* widgets */
.widget{background:var(--card2);border:2px solid var(--line);border-radius:var(--radius);padding:14px;margin:12px 0}
.widget h4{margin-bottom:6px}
.widget svg{width:100%;height:auto;display:block;background:color-mix(in srgb,var(--bg) 60%,transparent);border-radius:10px}
.ctl{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;margin:8px 0}
.ctl label{font-weight:700}
.ctl output{font-family:var(--head);font-weight:800;min-width:5.5ch;text-align:right;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.readout{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.readout div{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:700}
.readout b{color:var(--accent);font-family:var(--head)}
.sim{background:var(--warn);color:#241500;padding:4px 10px;border-radius:6px;font-weight:800;display:inline-block;font-size:.85rem}
svg text{font-family:var(--body);fill:var(--text)}
svg .lbl{font-size:13px;font-weight:700}
svg .sm{font-size:11px}
svg .mut{fill:var(--muted)}

/* stepper */
.step{display:none}.step.on{display:block;animation:fade .35s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.stephead{display:flex;gap:10px;align-items:center}
.stepnum{background:var(--accent);color:var(--accent-ink);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-weight:900;flex:none}

/* questions */
.q{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:16px;margin:14px 0;position:relative}
.q.done{border-color:var(--good)}
.q .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.q .prompt{font-size:1.08rem;font-weight:600}
.q svg{max-width:560px;display:block;margin:8px 0;background:var(--card2);border-radius:10px}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--card2);border:2px solid var(--line);border-radius:12px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt.sel{border-color:var(--accent)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--card2))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card2))}
.ans{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
input[type=text],input[type=number],input[type=search],select,textarea{font:inherit;color:var(--text);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px 12px}
input.num{width:11ch;font-weight:800;font-size:1.1rem}
textarea{width:100%;min-height:90px}
.fb{border-radius:10px;padding:10px 14px;margin:10px 0;border-left:6px solid var(--info);background:var(--card2)}
.fb.good{border-color:var(--good)}.fb.bad{border-color:var(--bad)}.fb.part{border-color:var(--warn)}
.fb b.t{font-family:var(--head)}
.steps{counter-reset:s;list-style:none;padding:0;margin:6px 0}
.steps li{counter-increment:s;padding:4px 0 4px 34px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:0;top:3px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800;display:grid;place-items:center;font-size:.8rem}
.xpfloat{position:absolute;right:16px;top:8px;color:var(--accent);font-family:var(--head);font-weight:900;font-size:1.4rem;animation:float 1.4s forwards;pointer-events:none}
@keyframes float{to{transform:translateY(-34px);opacity:0}}
.scheme label{display:flex;gap:8px;padding:5px 0;align-items:flex-start}
.kw{color:var(--good);font-weight:700}
.match{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}

/* trophy */
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.badge{text-align:center;padding:16px}
.badge svg{width:110px;height:110px}
.badge.locked svg{filter:grayscale(1) brightness(.55)}
.badge.locked{opacity:.85}
.shelf{border-bottom:10px solid var(--card2)}

/* toast/modal */
#toasts{position:fixed;right:14px;bottom:14px;display:grid;gap:8px;z-index:60;max-width:92vw}
.toast{background:var(--card);border:2px solid var(--accent);border-radius:12px;padding:10px 14px;font-weight:700;box-shadow:var(--shadow);animation:fade .3s}
.modal-bg{position:fixed;inset:0;background:rgba(5,8,14,.72);display:grid;place-items:center;z-index:70;padding:16px}
.modal{background:var(--card);border:3px solid var(--accent);border-radius:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px;position:relative}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(720deg)}}
.badge-pop{animation:pop .7s}
@keyframes pop{0%{transform:scale(.3) rotate(-20deg)}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1)}}

/* timed */
.timer{font-family:var(--head);font-size:2.4rem;font-weight:900;color:var(--accent)}
.scorebar{display:flex;gap:10px;flex-wrap:wrap}

.no-anim *,.no-anim *::before,.no-anim *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.hl{background:color-mix(in srgb,var(--accent) 30%,transparent);padding:0 4px;border-radius:4px}
.cw{color:var(--c1);font-weight:800}.acw{color:var(--c5);font-weight:800}
.small{font-size:.88rem;color:var(--muted)}
.hide{display:none!important}
.drag{cursor:grab;touch-action:none}
.drag:active{cursor:grabbing}
.zone-ctl{display:flex;gap:2px;align-items:center;justify-content:center}
.bus-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:8px 0}
.bus-grid div{background:var(--card);border:2px solid var(--line);border-radius:10px;text-align:center;padding:6px 2px}
.bus-grid button{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);background:var(--card2);color:var(--text);font-weight:900;cursor:pointer}
@media(max-width:640px){.bus-grid{grid-template-columns:repeat(4,1fr)}h1{font-size:1.6rem}.bignum{font-size:2.6rem}}

/* ---- bilingual mode ---- */
.tr{display:block;font-size:.86em;font-weight:500;color:var(--tr,#0b6a8a);line-height:1.5;margin-top:.15em}
@media (prefers-color-scheme:dark){:root[data-theme="auto"] .tr{--tr:#7fd3ee}}
:root[data-theme="dark"] .tr{--tr:#7fd3ee}
nav.main .tr{display:inline;margin-left:.35em;font-size:.8em}
button .tr,.btn .tr,a.btn .tr{font-weight:500;opacity:.9}
.tr.hint{margin-top:.5em;padding:.35em .6em;border-left:3px solid currentColor;background:rgba(11,106,138,.08);border-radius:4px}
.tr.learnblock{margin-top:14px;padding:12px 14px;border:1px dashed currentColor;border-radius:10px;font-size:.95em;color:inherit}
.tr.learnblock h3{margin:.1em 0 .4em;color:var(--tr,#0b6a8a)}
.tr.learnblock ul{margin:.3em 0 .3em 1.2em;padding:0}
.tr[lang="th"],.tr[lang="th"] *{font-family:"Leelawadee UI","Noto Sans Thai","Sarabun",Thonburi,Tahoma,sans-serif;line-height:1.7}
#langsel{font:inherit;padding:.3em .5em;border-radius:8px;border:2px solid var(--line,#999);background:var(--card,#fff);color:inherit;margin-right:.4em}
.stage .tr,.btn.primary .tr,[aria-current="step"] .tr,.chip .tr{color:inherit;opacity:.85}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/home" aria-label="9P1 Work and Moments Academy – home">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="var(--accent)"/><path d="M10 36 L54 24" stroke="#12161d" stroke-width="6" stroke-linecap="round"/><polygon points="32,32 22,52 42,52" fill="#12161d"/></svg>
      <span>9P1 Work &amp; Moments Academy<small>Year 9 Physics revision</small></span>
    </a>
    <div class="xpchip" id="xpchip" role="status"></div>
    <nav class="main" aria-label="Main">
      <a id="nav-home" href="#/home">Home</a>
      <a id="nav-trophies" href="#/trophies">Trophies</a>
      <button id="toolbtn" type="button">Toolkit</button>
      <a id="nav-settings" href="#/settings">Settings</a>
    </nav>
  </div>
</header>
<main id="main" tabindex="-1"><noscript><p>This revision site needs JavaScript. Please enable it in your browser.</p></noscript></main>
<footer>
  <p>Made for 9P1 revision. Progress is stored in this browser only. <a href="teacher.html">Teacher area</a></p>
</footer>
<div id="toasts" aria-live="polite"></div>
<div id="live" class="sr" aria-live="assertive"></div>
<script>/* Optional configuration. Leave syncUrl empty for fully standalone (localStorage-only) mode.
   If you host server/server.js, set syncUrl to e.g. "https://your-school-host/api/progress"
   and pupils' progress summaries will be posted there automatically (see README). */
window.PA_CONFIG = {
  syncUrl: "",
  classCode: ""
};
</script>
<script>/* Shared utilities. Everything hangs off the global PA namespace (classic scripts, so the app also works from file://). */
window.PA = window.PA || {};
PA.modules = []; PA.gen = {}; PA.diag = {}; PA.widgets = {}; PA.util = {};
(function(){
const U = PA.util;
U.$ = (s, el) => (el || document).querySelector(s);
U.$$ = (s, el) => Array.from((el || document).querySelectorAll(s));
U.esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
U.h = function(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c)); });
  return el;
};
U.html = (str) => { const t = document.createElement('template'); t.innerHTML = str.trim(); return t.content.firstChild; };
/* seeded RNG */
U.rng = function(seed){ let a = seed >>> 0; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
U.newSeed = () => Math.floor(Math.random() * 4294967295);
U.int = (r, a, b) => a + Math.floor(r() * (b - a + 1));
U.step = (r, a, b, s) => a + s * Math.floor(r() * (Math.round((b - a) / s) + 1)); // a..b in steps of s
U.pick = (r, arr) => arr[Math.floor(r() * arr.length)];
U.shuffle = (r, arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
U.round = (n, dp) => { const f = Math.pow(10, dp || 0); return Math.round((n + Number.EPSILON) * f) / f; };
/* Display a number without floating-point noise */
U.n = (n, dp) => { if (dp == null) dp = 6; let v = U.round(n, dp); return String(v); };
U.parseNum = function(s){
  if (s == null) return NaN;
  s = String(s).trim().replace(/−/g, '-').replace(/,/g, '').replace(/\s+/g, '');
  if (!/^-?\d*\.?\d+(e-?\d+)?$/i.test(s)) return NaN;
  return parseFloat(s);
};
U.norm = s => String(s || '').toLowerCase().replace(/[×*·]/g, 'x').replace(/÷/g, '/').replace(/[\s.,;:'"()]/g, '').replace(/−/g, '-');
U.uid = () => Math.random().toString(36).slice(2, 9);
U.debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
U.ucfirst = s => s.charAt(0).toUpperCase() + s.slice(1);
U.sum = a => a.reduce((x, y) => x + y, 0);
U.mean = a => U.sum(a) / a.length;
U.announce = function(msg){ const el = U.$('#live'); if (el) { el.textContent = ''; setTimeout(() => el.textContent = msg, 30); } };
U.unitHints = {
  J: 'Work done and energy are measured in joules (J).',
  N: 'Forces are measured in newtons (N).',
  Nm: 'Moments are measured in newton-metres (Nm). Do not use J – a moment is not an energy.',
  W: 'Power is measured in watts (W), where 1 W = 1 J/s.',
  m: 'Distances are measured in metres (m).',
  s: 'Time is measured in seconds (s).',
  kg: 'Mass is measured in kilograms (kg).',
  cm: 'cm is a centimetre – convert to metres before using the equations.',
  kW: 'kW is a kilowatt (1 kW = 1000 W).',
  kN: 'kN is a kilonewton (1 kN = 1000 N).',
  none: 'This quantity has no unit – it is a ratio.'
};
U.unitLabel = u => ({none:'(no unit)'}[u] || u);
})();
</script>
<script>/* Persistent state (localStorage) + XP / levels. Standalone: data lives only in this browser on this device. */
(function(){
const U = PA.util;
const KEY = '9p1academy.v1';
const LEVELS = [
  {n:1, name:'Physics Rookie', xp:0},
  {n:2, name:'Science Apprentice', xp:100},
  {n:3, name:'Physics Explorer', xp:250},
  {n:4, name:'Problem Solver', xp:500},
  {n:5, name:'Physics Expert', xp:800},
  {n:6, name:'Physics Champion', xp:1200}
];
const STAGES = ['learn', 'watch', 'practise', 'challenge', 'master'];
function fresh(){
  return { v:1, name:'', cls:'', created:Date.now(), updated:Date.now(), xp:0,
    settings:{anim:true, theme:'auto', size:1},
    q:{}, stages:{}, learnPos:{}, mastery:{}, flags:{}, counters:{work:0, moments:0, streak:0, bestStreak:0, sprint:0},
    badges:{}, topics:{}, ao:{}, events:[], last:'#/home', sprintBest:0, assess:{best:null, tries:[]}, busSolved:{} };
}
let memoryOnly = false;
let S = fresh();
const Store = PA.store = {
  LEVELS, STAGES,
  get state(){ return S; },
  persistent(){ return !memoryOnly; },
  load(){
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { const d = JSON.parse(raw); S = Object.assign(fresh(), d); S.settings = Object.assign(fresh().settings, d.settings || {}); S.counters = Object.assign(fresh().counters, d.counters || {}); }
    } catch (e) { memoryOnly = true; }
    return S;
  },
  save: null,
  _save(){
    S.updated = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(S)); memoryOnly = false; } catch (e) { memoryOnly = true; }
    if (Store.onSave) Store.onSave();
  },
  reset(){ S = fresh(); try { localStorage.removeItem(KEY); } catch (e) {} Store._save(); },
  importState(obj){ S = Object.assign(fresh(), obj); Store._save(); },
  level(xp){ xp = xp == null ? S.xp : xp; let l = LEVELS[0]; LEVELS.forEach(x => { if (xp >= x.xp) l = x; }); return l; },
  nextLevel(xp){ xp = xp == null ? S.xp : xp; return LEVELS.find(x => x.xp > xp) || null; },
  addXP(n, why){
    if (!n) return;
    const before = Store.level().n;
    S.xp += n;
    Store.event({type:'xp', n, why});
    if (Store.onXP) Store.onXP(n, why);
    if (Store.level().n > before && Store.onLevel) Store.onLevel(Store.level());
  },
  event(e){ e.t = Date.now(); S.events.push(e); if (S.events.length > 300) S.events.splice(0, S.events.length - 300); },
  /* question slot state */
  slot(id){ return S.q[id] || (S.q[id] = {done:false, first:false, att:0, xp:0}); },
  topicStat(topic, ok){ if (!topic) return; const t = S.topics[topic] || (S.topics[topic] = {a:0, c:0}); t.a++; if (ok) t.c++; },
  aoStat(ao, got, max){ if (!ao) return; const t = S.ao[ao] || (S.ao[ao] = {got:0, max:0}); t.got += got; t.max += max; },
  stageDone(mod, stage){ return !!(S.stages[mod] && S.stages[mod][stage]); },
  setStage(mod, stage){ if (!S.stages[mod]) S.stages[mod] = {}; if (!S.stages[mod][stage]) { S.stages[mod][stage] = Date.now(); Store.event({type:'stage', mod, stage}); Store._save(); PA.gamify.check(); } },
  moduleComplete(mod){ return STAGES.every(s => Store.stageDone(mod, s)); },
  mastered(mod){ const m = S.mastery[mod]; return !!(m && m.best >= 80); },
  moduleProgress(mod){ return STAGES.filter(s => Store.stageDone(mod, s)).length; },
  /* mastery check result – applies the XP rules from the brief */
  recordMastery(mod, pct, label){
    const m = S.mastery[mod] || (S.mastery[mod] = {best:0, last:0, tries:[], xpDone:false, xp80:false});
    const prev = m.tries.length ? m.best : null;
    const out = {xp:0, notes:[], improved:false};
    m.last = pct; m.tries.push({t:Date.now(), s:pct});
    if (m.tries.length > 20) m.tries.shift();
    if (!m.xpDone) { m.xpDone = true; Store.addXP(30, label + ' check completed'); out.xp += 30; out.notes.push('+30 XP for completing the mastery check'); }
    if (pct >= 80 && !m.xp80) { m.xp80 = true; Store.addXP(20, label + ' ≥80%'); out.xp += 20; out.notes.push('+20 XP for scoring 80% or more'); }
    if (prev != null && pct > prev) { Store.addXP(15, label + ' improved'); out.xp += 15; out.improved = true; out.notes.push('+15 XP for beating your previous best (' + Math.round(prev) + '%)'); S.flags.improved = true; }
    if (pct > m.best) m.best = pct;
    Store.event({type:'mastery', mod, pct});
    Store._save(); PA.gamify.check();
    return out;
  }
};
Store.save = U.debounce(Store._save, 150);
})();
</script>

<script>/* Static SVG diagram generators (return strings). Colours use CSS variables so light/dark themes both work. */
(function(){
const D = PA.diag, U = PA.util;
const COL = {r:'var(--c5)', l:'var(--c1)', u:'var(--good)', d:'var(--c2)'};
const svg = (w, h, inner, label) => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${U.esc(label || 'diagram')}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
D.svg = svg;
const arrowHead = (x, y, dir, c) => {
  const s = 9; const p = {right:[[x, y], [x - 2 * s, y - s], [x - 2 * s, y + s]], left:[[x, y], [x + 2 * s, y - s], [x + 2 * s, y + s]], up:[[x, y], [x - s, y + 2 * s], [x + s, y + 2 * s]], down:[[x, y], [x - s, y - 2 * s], [x + s, y - 2 * s]]}[dir];
  return `<polygon points="${p.map(q => q.join(',')).join(' ')}" fill="${c}"/>`;
};
D.arrow = function(x1, y1, x2, y2, c, w){
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, s = 10;
  const bx = x2 - ux * s * 1.6, by = y2 - uy * s * 1.6;
  return `<line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" stroke="${c}" stroke-width="${w || 5}" stroke-linecap="round"/><polygon points="${x2},${y2} ${bx - uy * s},${by + ux * s} ${bx + uy * s},${by - ux * s}" fill="${c}"/>`;
};
/* Forces on a box. forces: [{dir:'left|right|up|down', mag, label?}] */
D.forceDiagram = function(forces, opts){
  opts = opts || {};
  const W = 420, H = 250, cx = 210, cy = 125, bw = 70, bh = 50;
  const max = Math.max(...forces.map(f => f.mag), 1); const k = 105 / max;
  let g = `<rect x="0" y="${cy + bh / 2}" width="${W}" height="${H - cy - bh / 2}" fill="var(--card)" opacity=".6"/><rect x="${cx - bw / 2}" y="${cy - bh / 2}" width="${bw}" height="${bh}" rx="6" fill="var(--card2)" stroke="var(--text)" stroke-width="3"/><text x="${cx}" y="${cy + 5}" text-anchor="middle" class="lbl">${opts.name || 'object'}</text>`;
  forces.forEach(f => {
    const L = Math.max(24, f.mag * k); const c = COL[f.dir[0]];
    let x1, y1, x2, y2, tx, ty, anchor = 'middle';
    if (f.dir === 'right') { x1 = cx + bw / 2; y1 = cy; x2 = x1 + L; y2 = cy; tx = (x1 + x2) / 2; ty = cy - 12; }
    if (f.dir === 'left') { x1 = cx - bw / 2; y1 = cy; x2 = x1 - L; y2 = cy; tx = (x1 + x2) / 2; ty = cy - 12; }
    if (f.dir === 'up') { x1 = cx; y1 = cy - bh / 2; x2 = cx; y2 = y1 - L * .8; tx = cx + 10; ty = (y1 + y2) / 2; anchor = 'start'; }
    if (f.dir === 'down') { x1 = cx; y1 = cy + bh / 2; x2 = cx; y2 = y1 + L * .8; tx = cx + 10; ty = (y1 + y2) / 2; anchor = 'start'; }
    g += D.arrow(x1, y1, x2, y2, c) + `<text x="${tx}" y="${ty}" text-anchor="${anchor}" class="lbl">${f.label || (f.mag + ' ' + (opts.unit || 'N'))}</text>`;
  });
  return svg(W, H, g, opts.alt || 'Force arrows acting on an object: ' + forces.map(f => (f.label || f.mag + ' N') + ' ' + f.dir).join(', '));
};
/* Beam with pivot and downward/upward point forces.
   forces: [{x: metres from pivot (negative = left), F, label?, dir:'down'|'up', unknown?:bool}] */
D.beamDiagram = function(o){
  const W = 640, H = 230, py = 130, cx = 320, half = o.half || 4; const sc = 260 / half; // px per metre
  let g = '';
  g += `<polygon points="${cx},${py + 4} ${cx - 26},${py + 56} ${cx + 26},${py + 56}" fill="var(--text)" opacity=".85"/><text x="${cx}" y="${py + 74}" text-anchor="middle" class="lbl">pivot</text>`;
  g += `<rect x="${cx - half * sc - 14}" y="${py - 9}" width="${half * 2 * sc + 28}" height="14" rx="4" fill="var(--c2)" stroke="var(--text)" stroke-width="2"/>`;
  if (o.ticks !== false) for (let m = -half; m <= half; m++) g += `<line x1="${cx + m * sc}" y1="${py + 5}" x2="${cx + m * sc}" y2="${py + 12}" stroke="var(--text)"/>` + (o.showScale ? `<text x="${cx + m * sc}" y="${py + 24}" text-anchor="middle" class="sm mut">${Math.abs(m)}</text>` : '');
  (o.forces || []).forEach((f, i) => {
    const x = cx + f.x * sc; const c = f.x < 0 ? COL.r : COL.l;
    if ((f.dir || 'down') === 'down') g += D.arrow(x, py - 82, x, py - 12, f.unknown ? 'var(--warn)' : c, 5) + `<text x="${x}" y="${py - 92}" text-anchor="middle" class="lbl">${f.label || (f.F + ' N')}</text>`;
    else g += D.arrow(x, py + 90, x, py + 14, f.unknown ? 'var(--warn)' : c, 5) + `<text x="${x}" y="${py + 106}" text-anchor="middle" class="lbl">${f.label || (f.F + ' N')}</text>`;
    if (o.dims !== false) { const dl = f.dlabel || (Math.abs(f.x) + ' ' + (o.unit || 'm')); g += `<line x1="${cx}" y1="${py - 28}" x2="${x}" y2="${py - 28}" stroke="var(--muted)" stroke-dasharray="4 3"/><text x="${(cx + x) / 2}" y="${py - 32 - (i % 2) * 14}" text-anchor="middle" class="sm mut">${dl}</text>`; }
  });
  g += `<text x="12" y="20" class="sm mut">↺ left side turns anticlockwise</text><text x="${W - 12}" y="20" text-anchor="end" class="sm mut">right side turns clockwise ↻</text>`;
  return svg(W, H, g, o.alt || 'Beam balanced on a pivot with forces acting at different distances');
};
/* Spanner + force at angle. Used for the "which line is the perpendicular distance" questions. */
D.perpDiagram = function(angleDeg){
  angleDeg = angleDeg || 30;
  const px = 70, py = 170, L = 240, a = angleDeg * Math.PI / 180;
  const tx = px + L * Math.cos(a), ty = py - L * Math.sin(a);
  let g = `<line x1="${px}" y1="${py}" x2="${tx}" y2="${ty}" stroke="var(--c2)" stroke-width="14" stroke-linecap="round"/>`;
  g += `<line x1="${tx}" y1="${ty - 90}" x2="${tx}" y2="${py + 60}" stroke="var(--muted)" stroke-dasharray="6 4" stroke-width="2"/>`;
  g += D.arrow(tx, ty - 8, tx, ty + 78 < py ? ty + 78 : py + 20, 'var(--c5)', 5);
  g += `<text x="${tx + 10}" y="${ty + 30}" class="lbl">F</text><text x="${tx + 10}" y="${py + 58}" class="sm mut">line of action</text>`;
  g += `<line x1="${px}" y1="${py}" x2="${tx}" y2="${py}" stroke="var(--good)" stroke-width="3"/><rect x="${tx - 12}" y="${py - 12}" width="12" height="12" fill="none" stroke="var(--good)"/>`;
  g += `<line x1="${px}" y1="${py}" x2="${tx}" y2="${py + 46}" stroke="var(--info)" stroke-width="3" stroke-dasharray="2 4"/>`;

  g += `<text x="${(px + tx) / 2}" y="${py - 8}" class="lbl" style="fill:var(--good)">B</text>`;
  g += `<text x="${(px + tx) / 2 + 20}" y="${py + 34}" class="lbl" style="fill:var(--info)">C</text>`;
  return svg(420, 260, g, 'Spanner turning about a pivot with a downward force. Line A is along the spanner, line B is horizontal from the pivot to the line of action meeting it at 90 degrees, line C slants from the pivot to the line of action.');
};
/* Lever classes. cls: 1,2,3 */
D.leverClass = function(cls, o){
  o = o || {};

  if (cls === 1) { pivotX = 190; loadX = 85; effX = 295; }
  if (cls === 2) { pivotX = 50; loadX = 170; effX = 305; }

  g += D.arrow(loadX, 46, loadX, by - 9, 'var(--c1)', 4) + lab(loadX, 'L', 'var(--c1)');
  if (cls === 2) g += D.arrow(effX, by + 70, effX, by + 9, 'var(--good)', 4) + `<circle cx="${effX}" cy="${by + 82}" r="14" fill="var(--good)"/><text x="${effX}" y="${by + 87}" text-anchor="middle" style="fill:#111;font-weight:900;font-size:14px">E</text>`;
  else if (cls === 3) g += D.arrow(effX, by + 70, effX, by + 9, 'var(--good)', 4) + `<circle cx="${effX}" cy="${by + 82}" r="14" fill="var(--good)"/><text x="${effX}" y="${by + 87}" text-anchor="middle" style="fill:#111;font-weight:900;font-size:14px">E</text>`;

/* Scatter graph. o: {pts:[{x,y,flag?}], xmax,ymax,xlabel,ylabel,line:{m,c}, w,h, xstep,ystep} */
D.graph = function(o){

};
/* Simple door/hinge plan view for turning-effect questions */
D.doorDiagram = function(){
  let g = `<rect x="40" y="90" width="12" height="80" fill="var(--text)"/><rect x="52" y="124" width="300" height="12" fill="var(--c2)"/><circle cx="46" cy="130" r="8" fill="var(--accent)"/><text x="46" y="82" text-anchor="middle" class="lbl">hinge (pivot)</text>`;
  g += D.arrow(90, 70, 90, 120, 'var(--c5)', 4) + `<text x="104" y="86" class="lbl">A</text>` + D.arrow(330, 70, 330, 120, 'var(--c5)', 4) + `<text x="344" y="86" class="lbl">B</text>`;

<script>/* Question engine: builds, marks and gives feedback for all question types.
   Types: mcq, num, match, fill, explain (self-assessed), multi (several parts), widget (interactive task). */
(function(){
const U = PA.util, h = U.h;
const Q = PA.Q = {};

/* helper to build MCQ definitions with shuffled options. wrongs: string or {t, why} */
Q.mcq = function(r, prompt, right, wrongs, extra){
  const all = [{t:right, ok:true}].concat(wrongs.map(w => typeof w === 'string' ? {t:w} : w));
  const sh = U.shuffle(r, all);
  return Object.assign({type:'mcq', prompt, options:sh.map(o => o.t), answer:sh.findIndex(o => o.ok), why:sh.map(o => o.why || null)}, extra || {});
};
Q.marksOf = q => q.type === 'multi' ? q.parts.reduce((a, p) => a + Q.marksOf(p), 0) : (q.type === 'match' ? q.left.length : (q.marks || 1));

function buildMCQ(q, uid){
  const box = h('div', {class:'opts', role:'radiogroup', 'aria-label':'Answer choices'});
  q.options.forEach((o, i) => {
    const id = uid + '-o' + i;
    box.append(h('label', {class:'opt', for:id}, h('input', {type:'radio', name:uid, id, value:i}), h('span', {html:o})));
  });
  box.addEventListener('change', () => U.$$('.opt', box).forEach(l => l.classList.toggle('sel', U.$('input', l).checked)));
  return {el:box,
    collect(){ const c = U.$('input:checked', box); return c ? +c.value : null; },
    mark(inp, prev){
      if (inp == null) return {empty:true, got:0, max:1, fb:[{cls:'part', html:'Choose an answer first.'}]};
      const ans = q.answerFn ? q.answerFn(prev) : q.answer;
      const ok = inp === ans;
      const fb = ok ? [{cls:'good', html:'<b class="t">Correct.</b> ' + (q.explain || '')}]
        : [{cls:'bad', html:'<b class="t">Not quite.</b> ' + (q.why && q.why[inp] ? q.why[inp] : (q.explain || 'Re-read the question and think about the key rule.'))}];
      return {got:ok ? 1 : 0, max:1, full:ok, fb, right:ans, mine:inp};
    },
    lock(res){
      U.$$('input', box).forEach(i => i.disabled = true);
      if (res && res.right != null) U.$$('.opt', box).forEach((l, i) => { if (i === res.right) l.classList.add('right'); else if (i === res.mine) l.classList.add('wrong'); });
    },
    unlock(){ U.$$('input', box).forEach(i => i.disabled = false); U.$$('.opt', box).forEach(l => l.classList.remove('right', 'wrong')); }
  };
}
function buildNum(q, uid){
  const inp = h('input', {type:'text', inputmode:'decimal', class:'num', id:uid, autocomplete:'off', 'aria-label':'Your numerical answer'});
  const wrap = h('div', {class:'ans'}, h('label', {for:uid, class:'small'}, (q.label || 'Answer') + ' ='), inp);
  let sel = null;
  if (q.unit && q.unit !== 'none') {
    const choices = (q.unitChoices || ['N', 'J', 'W', 'Nm', 'm', 's', 'kg']).slice();
    if (!choices.includes(q.unit)) choices.push(q.unit);
    sel = h('select', {id:uid + 'u', 'aria-label':'Unit'}, h('option', {value:''}, 'unit…'), choices.map(c => h('option', {value:c}, c)));
    wrap.append(sel);
  }
  return {el:wrap, input:inp,
    collect(){ return {v:inp.value, u:sel ? sel.value : null}; },
    parsed(i){ return U.parseNum(i.v); },
    mark(i, prev){
      const ans = q.answerFn ? q.answerFn(prev) : q.answer;
      const max = q.marks || 1;
      const v = U.parseNum(i.v);
      if (i.v.trim() === '') return {empty:true, got:0, max, fb:[{cls:'part', html:'Type your answer in the box first.'}]};
      if (isNaN(v)) return {got:0, max, fb:[{cls:'bad', html:'<b class="t">I cannot read that as a number.</b> Use digits only, for example 2.5 – choose the unit in the unit box.'}]};
      const tol = q.tol == null ? 0.011 : q.tol;
      const close = (a, b) => Math.abs(a - b) <= Math.max(Math.abs(b) * tol, 1e-9);
      const numOK = close(v, ans);
      const needU = q.unit && q.unit !== 'none';
      const unitOK = !needU || i.u === q.unit;
      if (numOK && unitOK) return {got:max, max, full:true, fb:[{cls:'good', html:'<b class="t">Correct.</b> ' + U.n(ans, 4) + (needU ? ' ' + q.unit : '') + '. ' + (q.explain || '')}]};
      if (numOK && !unitOK) {
        const given = i.u ? 'You chose “' + U.esc(i.u) + '”. ' : 'You did not choose a unit. ';
        return {got:Math.max(0, max - 1), max, full:false, partial:true, fb:[{cls:'part', html:'<b class="t">Right number, wrong unit.</b> ' + given + (U.unitHints[q.unit] || 'Check the unit.')}]};
      }
      let msg = '';
      (q.common || []).some(c => { if (close(v, c.value)) { msg = c.msg; return true; } });
      if (!msg) {
        const ratio = ans ? v / ans : 0;
        if (Math.abs(ratio - 100) < 1 || Math.abs(ratio - 0.01) < 0.001 || Math.abs(ratio - 1000) < 5 || Math.abs(ratio - 0.001) < 0.0001) msg = 'Your answer is out by a factor of 10, 100 or 1000 – check your unit conversion (cm → m: ÷100, kN → N: ×1000, kW → W: ×1000).';
        else msg = q.hint ? 'Check your method. Hint: ' + q.hint : 'Check your method and your arithmetic, then try again.';
      }
      return {got:0, max, full:false, fb:[{cls:'bad', html:'<b class="t">Not yet.</b> ' + msg}]};
    },
    lock(){ inp.disabled = true; if (sel) sel.disabled = true; },
    unlock(){ inp.disabled = false; if (sel) sel.disabled = false; }
  };
}
function buildMatch(q, uid){
  const box = h('div', {class:'match'});
  const sels = q.left.map((l, i) => {
    const s = h('select', {id:uid + 'm' + i, 'aria-label':'Match for ' + l.replace(/<[^>]+>/g, '')}, h('option', {value:''}, 'choose…'), q.right.map((r, j) => h('option', {value:j}, r)));
    box.append(h('label', {for:uid + 'm' + i, html:l}), s); return s;
  });
  return {el:box,
    collect(){ return sels.map(s => s.value === '' ? null : +s.value); },
    mark(inp){
      const n = q.left.length;
      if (inp.some(x => x == null)) return {empty:true, got:0, max:n, fb:[{cls:'part', html:'Match every item before checking.'}]};
      const bad = []; let got = 0;
      inp.forEach((x, i) => { if (x === q.pairs[i]) got++; else bad.push(i); });
      const full = got === n;
      const fb = full ? [{cls:'good', html:'<b class="t">All matched correctly.</b> ' + (q.explain || '')}]
        : [{cls:got ? 'part' : 'bad', html:'<b class="t">' + got + ' of ' + n + ' correct.</b> Look again at: ' + bad.map(i => q.left[i].replace(/<[^>]+>/g, '')).join('; ') + '.'}];
      return {got, max:n, full, fb, bad};
    },
    lock(){ sels.forEach(s => s.disabled = true); },
    unlock(){ sels.forEach(s => s.disabled = false); }
  };
}
function buildFill(q, uid){
  const inp = h('input', {type:'text', id:uid, autocomplete:'off', style:'min-width:18ch', 'aria-label':'Your answer'});
  return {el:h('div', {class:'ans'}, inp), input:inp,
    collect(){ return inp.value; },
    mark(i){
      if (!i.trim()) return {empty:true, got:0, max:1, fb:[{cls:'part', html:'Type your answer first.'}]};
      const n = U.norm(i);
      const ok = (q.accept || []).some(a => U.norm(a) === n) || (q.acceptRe || []).some(re => re.test(n) || re.test(i.toLowerCase()));
      return ok ? {got:1, max:1, full:true, fb:[{cls:'good', html:'<b class="t">Correct.</b> ' + (q.explain || '')}]}
        : {got:0, max:1, full:false, fb:[{cls:'bad', html:'<b class="t">Not quite.</b> ' + (q.hint || 'Check the exact scientific term, equation or unit.')}]};
    },
    lock(){ inp.disabled = true; }, unlock(){ inp.disabled = false; }
  };
}
function buildExplain(q, uid){
  const ta = h('textarea', {id:uid, 'aria-label':'Write your answer here', placeholder:'Write your answer in full sentences…'});
  return {el:h('div', {}, ta), input:ta,
    collect(){ return ta.value; },
    mark(i){
      if (i.trim().length < 12) return {empty:true, got:0, max:q.marks, fb:[{cls:'part', html:'Write your answer first – a full sentence or two.'}]};
      return {pending:true, text:i, got:0, max:q.marks, fb:[]};
    },
    lock(){ ta.disabled = true; }, unlock(){ ta.disabled = false; }
  };
}
/* Self-assessment checklist for explain questions. Calls onDone(got) when the pupil saves. */
Q.selfMark = function(q, text, onDone){
  const low = text.toLowerCase();
  const wrap = h('div', {class:'fb'}, h('b', {class:'t'}, 'Mark it yourself against the mark scheme'),
    h('p', {class:'small'}, 'The computer cannot reliably mark free writing, so you decide. Tick each point your answer clearly made. Keywords I spotted are shown in green as a hint only.'));
  const scheme = h('div', {class:'scheme'});
  const boxes = q.scheme.map(p => {
    const spotted = (p.kw || []).length && p.kw.every(g => g.some(w => low.includes(w)));
    const cb = h('input', {type:'checkbox'});
    scheme.append(h('label', {}, cb, h('span', {}, p.t, spotted ? h('span', {class:'kw'}, '  (keywords spotted)') : '')));
    return cb;
  });
  wrap.append(scheme);
  wrap.append(h('div', {class:'callout'}, h('b', {class:'t'}, 'Model answer'), h('div', {html:q.model})));
  if (q.tip) wrap.append(h('p', {class:'small', html:'<b>How to improve:</b> ' + q.tip}));
  wrap.append(h('p', {class:'small'}, 'Marks available: ' + q.marks + '. Each ticked point earns one mark, up to the maximum.'));
  const btn = h('button', {class:'btn primary', onclick(){
    const got = Math.min(q.marks, boxes.filter(b => b.checked).length);
    boxes.forEach(b => b.disabled = true); btn.disabled = true; onDone(got);
  }}, 'Save my self-mark');
  wrap.append(btn);
  return wrap;
};
function buildMulti(q, uid){
  const parts = q.parts.map((p, i) => ({p, b:build(p, uid + 'p' + i)}));
  const el = h('div', {});
  parts.forEach(({p, b}, i) => {
    el.append(h('div', {style:'margin:10px 0'}, h('div', {class:'prompt', html:'(' + String.fromCharCode(97 + i) + ') ' + p.prompt + ' <span class="small">[' + Q.marksOf(p) + ']</span>'}), b.el));
  });
  return {el, parts,
    collect(){ return parts.map(x => x.b.collect()); },
    mark(inp){
      let got = 0, max = 0; const fb = []; const prev = []; let allEmpty = true; const subs = [];
      parts.forEach(({p, b}, i) => {
        const r = b.mark(inp[i], prev);
        prev.push(b.parsed ? b.parsed(inp[i]) : inp[i]);
        subs.push(r);
        max += Q.marksOf(p);
        if (!r.empty) allEmpty = false;
        got += r.got || 0;
        fb.push({cls:r.full ? 'good' : (r.partial ? 'part' : 'bad'), html:'<b>(' + String.fromCharCode(97 + i) + ')</b> ' + (r.empty ? 'No answer.' : r.fb.map(f => f.html).join(' '))});
      });
      if (allEmpty) return {empty:true, got:0, max, fb:[{cls:'part', html:'Answer at least one part before checking.'}]};
      return {got, max, full:got === max, fb, subs};
    },
    lock(){ parts.forEach(x => x.b.lock && x.b.lock()); }, unlock(){ parts.forEach(x => x.b.unlock && x.b.unlock()); }
  };
}
function build(q, uid){
  switch (q.type) {
    case 'mcq': return buildMCQ(q, uid);
    case 'num': return buildNum(q, uid);
    case 'match': return buildMatch(q, uid);
    case 'fill': return buildFill(q, uid);
    case 'explain': return buildExplain(q, uid);
    case 'multi': return buildMulti(q, uid);
  }
  throw new Error('Unknown question type ' + q.type);
}
Q.build = build;

function frame(spec, q, num){
  const meta = h('div', {class:'meta'});
  if (num) meta.append(h('span', {class:'chip'}, 'Q' + num));
  if (spec.ao) meta.append(h('span', {class:'chip'}, spec.ao));
  if (q.type !== 'widget') { const m = Q.marksOf(q); meta.append(h('span', {class:'chip'}, m + (m > 1 ? ' marks' : ' mark'))); }
  const f = h('div', {});
  f.append(meta);
  f.append(h('div', {class:'prompt', html:q.prompt}));
  if (q.diagram) f.append(h('div', {html:q.diagram, role:'img', 'aria-label':q.diagramAlt || 'Diagram for the question'}));
  return f;
}
function stepsHtml(q){
  if (!q.steps || !q.steps.length) return null;
  return h('div', {class:'callout key'}, h('b', {class:'t'}, 'Worked solution'), h('ol', {class:'steps', html:q.steps.map(s => '<li>' + s + '</li>').join('')}));
}

/* ---------- PRACTICE MODE (instant feedback, XP) ---------- */
Q.practice = function(container, spec, opts){
  opts = opts || {};
  const Store = PA.store;
  const slotId = spec.id;
  let replay = false, seed = U.newSeed();
  const holder = h('div', {class:'q'}); container.append(holder);
  function draw(){
    holder.innerHTML = '';
    let session = 0;
    const st = Store.slot(slotId);
    holder.classList.toggle('done', st.done);
    const q = spec.make(U.rng(seed));
    q.__spec = spec;
    if (st.done && !replay) holder.append(h('span', {class:'chip ok', style:'float:right'}, st.revealed ? 'Seen' : '✔ Completed'));
    holder.append(frame(spec, q, opts.num));
    const uid = 'q' + U.uid();
    const fbBox = h('div', {'aria-live':'polite'});
    const act = h('div', {class:'row'});
    let b, checkBtn = null, finished = false;
    if (q.type === 'widget') {
      b = {el:h('div', {}), lock(){}};
      holder.append(b.el);
    } else { b = build(q, uid); holder.append(b.el); }
    holder.append(act, fbBox);
    if (q.hint && q.type !== 'widget') {
      const hb = h('button', {class:'btn ghost sm', onclick(){ fbBox.append(h('div', {class:'fb'}, h('b', {class:'t'}, 'Hint: '), h('span', {html:q.hint}))); hb.disabled = true; }}, 'Need a hint?');
      act.append(hb);
    }
    function showAfter(){
      if (checkBtn) checkBtn.remove();
      const s = stepsHtml(q); if (s) fbBox.append(s);
      if (q.extra) fbBox.append(h('div', {class:'callout', html:q.extra}));
      act.append(h('button', {class:'btn sm', onclick(){ replay = true; seed = U.newSeed(); draw(); }}, 'Try again with new numbers'));
    }
    function finish(res){
      if (finished) return;
      fbBox.innerHTML = '';
      res.fb.forEach(f => fbBox.append(h('div', {class:'fb ' + f.cls, html:f.html})));
      if (res.empty) return;
      session++;
      const stt = Store.slot(slotId);
      stt.att++;
      Store.topicStat(spec.topic, res.full);
      const first = session === 1;
      if (res.full) {
        finished = true;
        let xp = 0;
        if (!replay && !stt.done) { xp = first ? 10 : 5; stt.xp = xp; stt.first = first; }
        stt.done = true;
        const C = Store.state.counters;
        if (first) { C.streak++; C.bestStreak = Math.max(C.bestStreak, C.streak); } else C.streak = 0;
        if (spec.skill === 'work') C.work++;
        if (spec.skill === 'moments') C.moments++;
        Store.aoStat(spec.ao, 1, 1);
        if (xp) { holder.append(h('span', {class:'xpfloat', 'aria-hidden':'true'}, '+' + xp + ' XP')); fbBox.append(h('p', {class:'small'}, first ? '+10 XP – correct first time!' : '+5 XP – correct after feedback.')); Store.addXP(xp, 'Q ' + slotId); }
        else fbBox.append(h('p', {class:'small'}, 'Practice only – XP is awarded once for each question.'));
        Store.event({type:'q', id:slotId, topic:spec.topic, ok:1, first, replay});
        holder.classList.add('done'); b.lock(res); showAfter();
      } else {
        Store.state.counters.streak = 0;
        Store.event({type:'q', id:slotId, topic:spec.topic, ok:0, replay});
        if (q.type !== 'widget' && session >= 3) {
          finished = true; stt.done = true; stt.revealed = true; Store.aoStat(spec.ao, 0, 1);
          fbBox.append(h('p', {class:'small'}, 'That was your third try, so here is the answer. Read the working, then try again with new numbers.'));
          b.lock(res); showAfter();
        } else if (q.type !== 'widget') fbBox.append(h('p', {class:'small'}, 'Attempt ' + session + ' of 3 – change your answer and check again.'));
      }
      Store._save(); PA.gamify.check();
      if (finished && opts.onDone) opts.onDone(spec, !!res.full);
    }
    if (q.type === 'widget') {
      q.mount(b.el, {attempt(ok, msg){ finish({got:ok ? 1 : 0, max:1, full:!!ok, fb:[{cls:ok ? 'good' : 'bad', html:msg || (ok ? '<b class="t">Correct!</b>' : '<b class="t">Not yet.</b> Adjust and test again.')}]}); }});
    } else {
      checkBtn = h('button', {class:'btn primary', onclick(){
        const res = b.mark(b.collect(), []);
        if (res.pending) {
          checkBtn.disabled = true; b.lock();
          const sm = Q.selfMark(q, res.text, got => {
            const ok = got >= q.marks; sm.remove();
            finish({got, max:q.marks, full:ok, fb:[{cls:ok ? 'good' : 'part', html:'<b class="t">' + (ok ? 'Full marks on your self-assessment.' : 'You gave yourself ' + got + '/' + q.marks + '.') + '</b> ' + (ok ? '' : 'Compare with the model answer, then improve your answer.')}]});
            if (!finished) { checkBtn.disabled = false; b.unlock(); }
          });
          fbBox.append(sm);
        } else finish(res);
      }}, 'Check answer');
      act.prepend(checkBtn);
      if (b.input && q.type !== 'explain') b.input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkBtn.click(); } });
    }
  }
  draw();
  return {redraw: draw};
};

/* ---------- PAPER MODE (feedback only at the end; mastery checks and final assessment) ---------- */
Q.paper = function(container, cfg){
  const items = cfg.items.map((spec, i) => { const q = spec.make(U.rng(U.newSeed())); q.__spec = spec; return {spec, q, num:i + 1}; });
  const wrap = h('div', {}); container.append(wrap);
  const total = items.reduce((a, it) => a + Q.marksOf(it.q), 0);
  wrap.append(h('div', {class:'callout key'}, h('b', {class:'t'}, cfg.title),
    h('p', {}, cfg.intro || 'Answer every question. You see feedback and your score after you submit.'),
    h('p', {class:'small'}, 'Total: ' + total + ' marks. The numbers are freshly generated for each attempt.')));
  items.forEach(it => {
    const holder = h('div', {class:'q'}); holder.append(frame(it.spec, it.q, it.num));
    const b = build(it.q, 'pp' + it.num + U.uid()); holder.append(b.el);
    const fb = h('div', {'aria-live':'polite'}); holder.append(fb);
    wrap.append(holder); it.b = b; it.holder = holder; it.fb = fb;
  });
  const submit = h('button', {class:'btn primary', onclick: doSubmit}, 'Submit and see my score');
  const bar = h('div', {class:'row'}, submit); wrap.append(bar);
  const sum = h('div', {class:'card', 'aria-live':'polite'}); let fin = null;
  function doSubmit(){
    const empties = items.filter(it => it.b.mark(it.b.collect(), []).empty).length;
    if (empties && !confirm(empties + ' question(s) are unanswered and will score 0. Submit anyway?')) return;
    submit.disabled = true;
    items.forEach(it => {
      let res = it.b.mark(it.b.collect(), []);
      it.b.lock(res);
      if (res.empty) res = {got:0, max:Q.marksOf(it.q), full:false, fb:[{cls:'bad', html:'<b class="t">No answer given.</b>'}]};
      it.res = res; it.got = res.got || 0;
      (res.fb || []).forEach(f => it.fb.append(h('div', {class:'fb ' + f.cls, html:f.html})));
      if (res.pending) {
        it.pending = true; it.got = 0;
        it.fb.append(Q.selfMark(it.q, res.text, got => { it.got = got; it.pending = false; refresh(); }));
      }
      const s = stepsHtml(it.q); if (s && !res.full) it.fb.append(s);
      if (it.q.extra && !res.full) it.fb.append(h('div', {class:'callout', html:it.q.extra}));
      it.holder.classList.toggle('done', !!res.full);
    });
    refresh();
  }
  function refresh(){
    sum.innerHTML = '';
    const got = items.reduce((a, it) => a + (it.got || 0), 0);
    const waiting = items.filter(it => it.pending).length;
    sum.append(h('h3', {}, 'Your score: ' + got + ' / ' + total + ' (' + Math.round(100 * got / total) + '%)'));
    if (waiting) sum.append(h('p', {class:'fb part'}, 'Self-mark ' + waiting + ' written answer(s) above to complete your score.'));
    if (!fin) fin = h('button', {class:'btn good', onclick(){
      if (items.some(it => it.pending)) { alert('Please self-mark the written answers first.'); return; }
      fin.disabled = true; cfg.onFinish(summary());
    }}, cfg.finishLabel || 'Finish and save');
    sum.append(fin);
    if (!sum.isConnected) wrap.append(sum);
  }
  function summary(){
    const byTopic = {}, byAO = {};
    items.forEach(it => {
      const m = Q.marksOf(it.q), g = it.got || 0;
      const t = it.spec.topic || 'other'; (byTopic[t] = byTopic[t] || {got:0, max:0}); byTopic[t].got += g; byTopic[t].max += m;
      const a = it.spec.ao || 'AO?'; (byAO[a] = byAO[a] || {got:0, max:0}); byAO[a].got += g; byAO[a].max += m;
    });
    const got = items.reduce((a, it) => a + (it.got || 0), 0);
    return {got, max:total, pct:100 * got / total, byTopic, byAO, items:items.map(it => ({id:it.spec.id, topic:it.spec.topic, ao:it.spec.ao, got:it.got || 0, max:Q.marksOf(it.q), q:it.spec.label || it.spec.id}))};
  }
};
})();
</script>
<script>/* Interactive widgets, part 1: stepper, energy explorer, force lab, work lab, power race, converter, calculation lab */
(function(){
const U = PA.util, h = U.h, D = PA.diag, W = PA.widgets;
const anim = () => PA.store.state.settings.anim && !matchMedia('(prefers-reduced-motion: reduce)').matches;
function slider(label, min, max, step, val, unit, onInput, id){

}
W.slider = slider;

/* ---- stepper: steps = [{title, html}] ---- */
W.stepper = function(el, steps, opts){
  opts = opts || {};
  let i = 0, maxSeen = 0;
  const wrap = h('div', {class:'widget'}), body = h('div', {'aria-live':'polite'});
  const dots = h('div', {class:'dots'}), prev = h('button', {class:'btn', onclick(){ go(i - 1); }}, '← Back'), next = h('button', {class:'btn primary', onclick(){ go(i + 1); }}, 'Next step');
  steps.forEach((s, k) => {
    const st = h('div', {class:'step'}, h('div', {class:'stephead'}, h('div', {class:'stepnum'}, k + 1), h('h3', {style:'margin:0'}, s.title)), h('div', {html:s.html}));

  wrap.append(body, dots, h('div', {class:'row spread'}, prev, next)); el.append(wrap);
  function go(n){
    i = Math.max(0, Math.min(steps.length - 1, n)); maxSeen = Math.max(maxSeen, i);

    dots.innerHTML = ''; steps.forEach((_, k) => dots.append(h('i', {class:k <= maxSeen ? 'on' : ''})));
    prev.disabled = i === 0; next.textContent = i === steps.length - 1 ? 'Finished ✓' : 'Next step'; next.disabled = i === steps.length - 1;
    if (i === steps.length - 1 && opts.onComplete) opts.onComplete();

};

/* ---- energy explorer ---- */
const SCEN = {

  ball:{name:'Dropped ball', from:'Gravitational potential store', path:'mechanically (force of gravity)', to:[['Kinetic store of ball', 100]], then:'On impact the ball squashes: kinetic → elastic potential store → kinetic again. Some energy is dissipated to thermal stores (and sound), so it never bounces back to the same height.', note:'Falling: gravity does work on the ball, transferring energy from the gravitational potential store to the kinetic store.'},
  kettle:{name:'Electric kettle', from:'Mains electricity supply', path:'electrically (current)', to:[['Thermal store of the water', 90], ['Thermal store of kettle and surroundings', 10]], note:'The current transfers energy electrically to the heating element, then by heating to the water’s thermal store.'},
  brake:{name:'Car braking', from:'Kinetic store of the car', path:'mechanically (friction force)', to:[['Thermal store of the brakes', 60], ['Thermal store of tyres, road and air', 40]], note:'Friction acts as the car moves, so the friction force does work and transfers energy mechanically to thermal stores.'},
  torch:{name:'Torch', from:'Chemical store (battery)', path:'electrically, then by radiation', to:[['Light carried away by radiation', 20], ['Thermal store of bulb and surroundings', 80]], note:'Energy is transferred electrically to the lamp, then by radiation (light) and heating.'}

W.energyExplorer = function(el){
  const wrap = h('div', {class:'widget'}, h('h4', {}, 'Energy transfer explorer'), h('p', {class:'small'}, 'Choose an everyday event. See where the energy starts, how it is transferred, and where it ends up.'));

    }).join('');
    const H = Math.max(150, 40 + s.to.length * 62);
    const mid = 50 + (s.to.length - 1) * 31;
    view.innerHTML = D.svg(760, H, `<rect x="20" y="${mid - 30}" width="230" height="60" rx="10" fill="var(--c1)"/><text x="135" y="${mid - 4}" text-anchor="middle" style="fill:#111;font-weight:800;font-size:13px">${s.from.length > 30 ? s.from.slice(0, 28) + '…' : s.from}</text><text x="135" y="${mid + 14}" text-anchor="middle" class="sm" style="fill:#111">100 J starts here</text>${rows}`, 'Energy transfer from ' + s.from + ' to ' + s.to.map(t => t[0]).join(', ')) +
      `<p><b>Pathway:</b> ${s.path}</p><p>${s.note}</p>${s.then ? '<p>' + s.then + '</p>' : ''}<div class="callout key"><b class="t">Conservation</b>Total energy out = total energy in (here 100 J). Energy is <b>dissipated</b> to the thermal store of the surroundings – it is not “used up” or “wasted” away. <span style="color:var(--c2);font-weight:800">Orange</span> = dissipated.</div>`;
  }
  show('rocket');
};

/* ---- force lab (box / rocket) ---- */
W.forceLab = function(el, mode){
  mode = mode || 'box';
  const wrap = h('div', {class:'widget'}); el.append(wrap);
  const svgBox = h('div'), read = h('div', {class:'readout', 'aria-live':'polite'}), ctl = h('div', {class:'ctl'});
  let F1 = mode === 'box' ? 30 : 100, F2 = mode === 'box' ? 30 : 60;
  wrap.append(h('h4', {}, mode === 'box' ? 'Force arrows: push and friction' : 'Rocket: thrust and weight'), svgBox, read, ctl);
  const s1 = slider(mode === 'box' ? 'Push to the right' : 'Thrust (upwards)', 0, mode === 'box' ? 60 : 120, mode === 'box' ? 5 : 10, F1, mode === 'box' ? 'N' : 'kN', v => { F1 = v; update(); });
  const s2 = slider(mode === 'box' ? 'Friction to the left' : 'Weight (downwards)', 0, mode === 'box' ? 60 : 120, mode === 'box' ? 5 : 10, F2, mode === 'box' ? 'N' : 'kN', v => { F2 = v; update(); });
  ctl.append(...s1.row, ...s2.row);
  const reset = h('button', {class:'btn sm', onclick(){ pos = mode === 'box' ? 40 : 0; vel = 0; update(); }}, 'Reset position'); wrap.append(reset);
  let pos = mode === 'box' ? 40 : 0, vel = 0, raf = null, last = 0, R = 0;
  function draw(){
    const u = mode === 'box' ? 'N' : 'kN';
    if (mode === 'box') {
      const bx = 40 + pos;
      let g = `<rect x="0" y="170" width="600" height="60" fill="var(--card)"/><line x1="0" y1="170" x2="600" y2="170" stroke="var(--text)" stroke-width="3"/><rect x="${bx}" y="120" width="80" height="50" rx="6" fill="var(--card2)" stroke="var(--text)" stroke-width="3"/><text x="${bx + 40}" y="150" text-anchor="middle" class="lbl">5 kg</text>`;
      if (F1) g += D.arrow(bx + 80, 145, bx + 80 + F1 * 2.4 + 12, 145, 'var(--c5)', 6) + `<text x="${bx + 90 + F1 * 1.2}" y="130" class="lbl">${F1} N</text>`;
      if (F2) g += D.arrow(bx, 145, bx - F2 * 2.4 - 12, 145, 'var(--c1)', 6) + `<text x="${bx - 10 - F2 * 1.2}" y="130" text-anchor="end" class="lbl">${F2} N</text>`;
      svgBox.innerHTML = D.svg(600, 230, g, 'Box with a push arrow to the right of ' + F1 + ' newtons and a friction arrow to the left of ' + F2 + ' newtons');
    } else {
      const by = 210 - pos; // y of rocket base
      let g = `<rect x="0" y="260" width="400" height="40" fill="var(--card)"/><rect x="170" y="250" width="60" height="12" fill="var(--muted)"/>`;
      const flame = F1 * 0.6;
      g += `<g transform="translate(200 ${by - 40})"><path d="M-14 28 L0 ${28 + flame + 6} L14 28Z" fill="var(--warn)"/><path d="M-9 28 L0 ${28 + flame * 0.6 + 4} L9 28Z" fill="var(--accent)"/><path d="M0 -62 C20 -34 20 0 14 28 H-14 C-20 0 -20 -34 0 -62Z" fill="var(--text)" stroke="var(--muted)" stroke-width="2"/><circle cx="0" cy="-20" r="7" fill="var(--c1)"/><path d="M-14 12 L-28 34 L-14 28Z M14 12 L28 34 L14 28Z" fill="var(--c5)"/></g>`;
      g += D.arrow(300, by - 40, 300, by - 40 - F1 * 0.9 - 8, 'var(--good)', 6) + `<text x="312" y="${by - 40 - F1 * 0.45}" class="lbl">thrust ${F1} kN</text>`;
      g += D.arrow(300, by - 40, 300, by - 40 + F2 * 0.9 + 8, 'var(--c2)', 6) + `<text x="312" y="${by - 40 + F2 * 0.5 + 6}" class="lbl">weight ${F2} kN</text>`;
      svgBox.innerHTML = D.svg(400, 300, g, 'Rocket with thrust ' + F1 + ' kilonewtons upward and weight ' + F2 + ' kilonewtons downward');
    }
  }
  function update(){
    R = F1 - F2;
    const onPad = mode === 'rocket' && pos <= 0;
    let msg;
    if (mode === 'box') msg = R === 0 ? 'Balanced: resultant force = 0 N. No change in motion – it stays still or keeps moving at a constant speed.' : 'Unbalanced: resultant ' + Math.abs(R) + ' N to the ' + (R > 0 ? 'right' : 'left') + '. The box accelerates ' + (R > 0 ? 'right' : 'left') + '.';
    else msg = R === 0 ? 'Balanced: thrust = weight, resultant 0 kN. The rocket does not accelerate' + (onPad ? ' – it stays on the pad.' : ' – it moves at a constant velocity.') : R > 0 ? 'Unbalanced: thrust is bigger, resultant ' + R + ' kN upwards. The rocket accelerates upwards.' : 'Weight is bigger, resultant ' + (-R) + ' kN downwards. ' + (onPad ? 'The pad supports it, so it stays put.' : 'It accelerates downwards.');
    read.innerHTML = `<div>Resultant: <b>${Math.abs(R)} ${mode === 'box' ? 'N' : 'kN'}${R ? (mode === 'box' ? (R > 0 ? ' →' : ' ←') : (R > 0 ? ' ↑' : ' ↓')) : ''}</b></div><div>${msg}</div>`;
    draw();
    if (anim() && !raf) { last = performance.now(); raf = requestAnimationFrame(tick); }
  }
  function tick(t){
    raf = null; if (!wrap.isConnected) return;
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    const a = (R / (mode === 'box' ? 5 : 60)) * (mode === 'box' ? 8 : 40);
    vel += a * dt;
    if (mode === 'box') { vel *= 1; pos += vel * dt * 6; if (pos > 480) { pos = -60; } if (pos < -60) pos = 480; if (Math.abs(vel) > 90) vel = 90 * Math.sign(vel); }
    else { pos += vel * dt; if (pos <= 0 && vel <= 0) { pos = 0; vel = 0; } if (pos > 200) { pos = 0; vel = Math.min(vel, 60); } }
    draw();
    if (Math.abs(vel) > 0.01 || (mode === 'rocket' && R > 0) ) raf = requestAnimationFrame(tick);
  }
  update();
};

/* ---- work lab ---- */
W.workLab = function(el){
  const wrap = h('div', {class:'widget'}, h('h4', {}, 'Work-done lab: W = F × s')); el.append(wrap);
  let F = 40, s = 5, unit = 'm', wall = false;
  const view = h('div'), read = h('div', {class:'readout', 'aria-live':'polite'}), ctl = h('div', {class:'ctl'});
  const sF = slider('Force F', 0, 200, 5, F, 'N', v => { F = v; draw(); });
  const sS = slider('Distance moved s', 0, 20, 0.5, s, '', v => { s = v; draw(); });
  sS.out.textContent = s + ' m';
  const uSel = h('select', {'aria-label':'Distance unit', onchange(){ unit = uSel.value; if (unit === 'cm') { sS.inp.max = 2000; sS.inp.step = 50; s = Math.round(s * 100); sS.inp.value = s; } else { sS.inp.max = 20; sS.inp.step = 0.5; s = Math.min(20, Math.round(s / 100)); sS.inp.value = s; } sS.out.textContent = s + ' ' + unit; draw(); }}, h('option', {value:'m'}, 'metres (m)'), h('option', {value:'cm'}, 'centimetres (cm)'));
  sS.inp.addEventListener('input', () => { sS.out.textContent = sS.inp.value + ' ' + unit; });
  const wallCb = h('input', {type:'checkbox', id:'wall', onchange(){ wall = wallCb.checked; draw(); }});
  ctl.append(...sF.row, ...sS.row, h('label', {for:'wunit'}, 'Distance unit'), uSel, h('span'), h('label', {for:'wall'}, 'The box is against a wall'), wallCb, h('span'));
  wrap.append(view, read, ctl);
  function draw(){
    const sm = wall ? 0 : (unit === 'cm' ? s / 100 : s);
    const Wd = F * sm;
    const bx = 70 + Math.min(sm, 20) * 18;
    let g = `<rect x="0" y="150" width="520" height="40" fill="var(--card)"/><rect x="${bx}" y="100" width="70" height="50" rx="6" fill="var(--card2)" stroke="var(--text)" stroke-width="3"/>`;
    if (wall) g += `<rect x="${bx + 70}" y="40" width="22" height="110" fill="var(--muted)"/>`;
    if (F) g += D.arrow(bx - 70, 125, bx - 4, 125, 'var(--c5)', 6) + `<text x="${bx - 70}" y="112" class="lbl">F = ${F} N</text>`;

    view.innerHTML = D.svg(520, 200, g, 'A box pushed with force ' + F + ' newtons through ' + U.n(sm, 3) + ' metres');
    read.innerHTML = `<div>s in metres: <b>${U.n(sm, 3)} m</b>${unit === 'cm' && !wall ? ' (' + s + ' cm ÷ 100)' : ''}</div><div>W = F × s = ${F} × ${U.n(sm, 3)} = <b>${U.n(Wd, 3)} J</b></div><div>${wall ? 'No displacement, so no energy is transferred mechanically: W = 0 J.' : (Wd ? 'Energy transferred mechanically: ' + U.n(Wd, 3) + ' J' : 'Nothing transferred.')}</div>`;
  }
  draw();
};

/* ---- power race ---- */
W.powerRace = function(el){
  const wrap = h('div', {class:'widget'}, h('h4', {}, 'Power race: same job, different time')); el.append(wrap);
  let Wk = 600, tA = 12, tB = 4;
  const view = h('div'), read = h('div', {class:'readout', 'aria-live':'polite'}), ctl = h('div', {class:'ctl'});
  const sW = slider('Work done by each lifter', 200, 2000, 100, Wk, 'J', v => { Wk = v; draw(0); });
  const sA = slider('Lifter A takes', 2, 20, 1, tA, 's', v => { tA = v; draw(0); });
  const sB = slider('Lifter B takes', 2, 20, 1, tB, 's', v => { tB = v; draw(0); });
  ctl.append(...sW.row, ...sA.row, ...sB.row);
  const go = h('button', {class:'btn primary', onclick: race}, 'Start lifting'); const rst = h('button', {class:'btn', onclick(){ draw(0); }}, 'Reset');
  wrap.append(view, read, ctl, h('div', {class:'row'}, go, rst));
  function draw(p){ // p seconds elapsed
    const yA = 200 - 140 * Math.min(1, p / tA), yB = 200 - 140 * Math.min(1, p / tB);
    const crate = (x, y, c, n) => `<rect x="${x}" y="${y - 36}" width="46" height="36" rx="4" fill="${c}" stroke="var(--text)" stroke-width="2"/><text x="${x + 23}" y="${y - 13}" text-anchor="middle" style="fill:#111;font-weight:900">${n}</text>`;
    view.innerHTML = D.svg(520, 240, `<line x1="30" y1="60" x2="30" y2="206" stroke="var(--muted)" stroke-dasharray="4 4"/><line x1="140" y1="60" x2="480" y2="60" stroke="var(--muted)" stroke-dasharray="4 4"/><text x="150" y="52" class="sm mut">same height</text><line x1="100" y1="206" x2="490" y2="206" stroke="var(--text)" stroke-width="3"/>${crate(150, yA, 'var(--c1)', 'A')}${crate(330, yB, 'var(--c5)', 'B')}<text x="173" y="226" text-anchor="middle" class="lbl">${U.n(Wk / tA, 1)} W</text><text x="353" y="226" text-anchor="middle" class="lbl">${U.n(Wk / tB, 1)} W</text>`, 'Two crates lifted the same height; A takes ' + tA + ' seconds, B takes ' + tB + ' seconds');
    const pA = Wk / tA, pB = Wk / tB;
    read.innerHTML = `<div>A: P = ${Wk} ÷ ${tA} = <b>${U.n(pA, 1)} W</b></div><div>B: P = ${Wk} ÷ ${tB} = <b>${U.n(pB, 1)} W</b></div><div>${pA === pB ? 'Equal power.' : (pA > pB ? 'A' : 'B') + ' has the greater power: the same work in less time.'}</div>`;
  }
  function race(){
    if (!anim()) { draw(Math.max(tA, tB)); return; }
    const t0 = performance.now(), tot = Math.max(tA, tB);

  }

};

/* ---- unit converter ---- */
W.unitConverter = function(el){

/* ---- calculation lab: levelled generator and timed sprint ---- */
W.calcLab = function(el, cfg){
  const Q = PA.Q;
  const wrap = h('div', {class:'widget'}, h('h4', {}, cfg.title), h('p', {class:'small', html:cfg.intro || ''})); el.append(wrap);

    } else next();

    area.innerHTML = ''; area.append(h('div', {class:'card'}, h('h3', {}, 'Time! You scored ' + right + ' from ' + tried + ' questions.'), h('p', {}, best ? '🏅 New personal best!' : 'Your best is ' + S.sprintBest + '. Can you beat it?'), h('button', {class:'btn primary', onclick(){ right = tried = 0; start(); }}, 'Go again')));

  }
  function next(){
    area.innerHTML = '';

    const b = Q.build(q, 'cl' + U.uid());

})();

<script>/* Interactive widgets, part 2: spanner lab, seesaw, lever lab, bus challenge, virtual investigation */
(function(){
const U = PA.util, h = U.h, D = PA.diag, W = PA.widgets;
const anim = () => PA.store.state.settings.anim && !matchMedia('(prefers-reduced-motion: reduce)').matches;
const slider = W.slider;

/* ---------- spanner lab ---------- */
W.spannerLab = function(el){
  const wrap = h('div', {class:'widget'}, h('h4', {}, 'Spanner lab: moment = force × perpendicular distance')); el.append(wrap);
  let L = 30, F = 40, ang = 90, up = false, rot = 0, raf = null, M = 0, last = 0;
  const view = h('div'), read = h('div', {class:'readout', 'aria-live':'polite'}), ctl = h('div', {class:'ctl'});
  const sL = slider('Handle length', 10, 50, 5, L, 'cm', v => { L = v; draw(); });
  const sF = slider('Force F', 0, 100, 5, F, 'N', v => { F = v; draw(); });

  const dirCb = h('input', {type:'checkbox', id:'upcb', onchange(){ up = dirCb.checked; draw(); }});

    const dm = L / 100 * Math.sin(th); M = F * dm;
    const pt = T.x * 0; // keep lint quiet
    const proj = Lpx * f.x; const foot = {x:T.x - proj * f.x, y:T.y - proj * f.y};

    g += `<rect x="${P.x}" y="${P.y - 9}" width="${Lpx}" height="18" rx="8" fill="var(--c2)" stroke="var(--text)" stroke-width="2"/>`;
    g += `<g transform="translate(${P.x} ${P.y}) rotate(${rot})"><polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="var(--card2)" stroke="var(--text)" stroke-width="3"/><circle r="6" fill="var(--text)"/></g>`;
    if (dm > 0.0005) g += `<line x1="${P.x}" y1="${P.y}" x2="${foot.x}" y2="${foot.y}" stroke="var(--good)" stroke-width="4"/><text x="${(P.x + foot.x) / 2 + (up ? 6 : 6)}" y="${(P.y + foot.y) / 2 + (up ? -10 : 22)}" class="lbl" style="fill:var(--good)">d = ${U.n(dm, 3)} m</text>`;
    if (F > 0) g += D.arrow(T.x - f.x * alen, T.y - f.y * alen, T.x, T.y, 'var(--c5)', 6) + `<text x="${T.x - f.x * alen + 10}" y="${T.y - f.y * alen + (up ? 16 : -8)}" class="lbl">F = ${F} N</text>`;
    g += `<text x="${P.x}" y="${P.y + 52}" text-anchor="middle" class="lbl">pivot (nut)</text><text x="${P.x + 140}" y="${up ? 22 : 300}" class="sm mut">dashed line = line of action</text>`;

    const dir = M === 0 ? 'no turning effect' : (up ? 'anticlockwise ↺' : 'clockwise ↻');
    read.innerHTML = `<div>Length: ${L} cm = <b>${U.n(L / 100, 2)} m</b></div><div>Perpendicular distance d = <b>${U.n(dm, 3)} m</b>${ang < 90 ? ' (less than the handle length!)' : ''}</div><div>M = F × d = ${F} × ${U.n(dm, 3)} = <b>${U.n(M, 2)} Nm</b></div><div>Direction: <b>${dir}</b></div>`;
    if (anim() && !raf && M > 0) { last = performance.now(); raf = requestAnimationFrame(spin); }
  }
  function spin(t){ raf = null; if (!wrap.isConnected || M <= 0) return; const dt = (t - last) / 1000; last = t; rot += (up ? -1 : 1) * Math.min(M, 30) * 12 * dt; if (rot > 360 || rot < -360) rot %= 360; draw(); raf = requestAnimationFrame(spin); }

/* ---------- seesaw ---------- */
W.seesaw = function(el, o){
  o = Object.assign({half:4, snap:0.5, showLive:true, predict:true, title:'Seesaw'}, o || {});
  const cx = 360, by = 170, sc = 78, TOL = 1e-6;
  const items = (o.items || []).map((it, i) => Object.assign({id:'w' + i, x:null}, it));
  let released = false, tilt = 0, dragId = null, msg = '';
  const wrap = h('div', {class:'widget'}, h('h4', {}, o.title)); el.append(wrap);
  if (o.intro) wrap.append(h('p', {class:'small', html:o.intro}));
  const view = h('div'), read = h('div', {class:'readout', 'aria-live':'polite'}), table = h('div');
  const pred = h('select', {id:'pred' + U.uid(), 'aria-label':'Your prediction'}, h('option', {value:''}, 'choose…'), h('option', {value:'acw'}, 'turns anticlockwise ↺'), h('option', {value:'bal'}, 'balances'), h('option', {value:'cw'}, 'turns clockwise ↻'));
  const rel = h('button', {class:'btn primary', onclick: release}, 'Release the beam'), rst = h('button', {class:'btn', onclick: reset}, 'Hold level again'), clr = h('button', {class:'btn ghost', onclick(){ items.forEach(i => { if (!i.fixed) i.x = null; }); reset(); }}, 'Clear my weights');
  wrap.append(view, read, table, h('div', {class:'row'}, o.predict ? [h('label', {for:pred.id}, 'Prediction: the beam…'), pred] : '', rel, rst, clr), h('div', {class:'small', 'aria-live':'polite', id:'ssmsg' + el.id}, ''));
  const msgEl = wrap.lastChild;
  function totals(){ let a = 0, c = 0; items.forEach(i => { if (i.x == null) return; if (i.x < 0) a += i.F * -i.x; else c += i.F * i.x; }); return {acw:a, cw:c, net:c - a}; }
  function tray(){ return items.filter(i => i.x == null); }
  function render(){
    const t = totals(); let g = '';
    const ang = released ? tilt : 0;
    g += `<polygon points="${cx},${by + 6} ${cx - 28},${by + 54} ${cx + 28},${by + 54}" fill="var(--text)" opacity=".9"/><text x="${cx}" y="${by + 72}" text-anchor="middle" class="lbl">pivot</text>`;
    g += `<g id="beamG" style="transform-origin:${cx}px ${by}px;transform:rotate(${ang}deg);transition:transform ${anim() ? '1.4s' : '0s'} cubic-bezier(.3,1.4,.5,1)">`;
    g += `<rect x="${cx - o.half * sc - 16}" y="${by - 8}" width="${o.half * 2 * sc + 32}" height="16" rx="5" fill="var(--c2)" stroke="var(--text)" stroke-width="2"/>`;
    for (let m = -o.half; m <= o.half; m++) g += `<line x1="${cx + m * sc}" y1="${by + 8}" x2="${cx + m * sc}" y2="${by + 15}" stroke="var(--text)"/><text x="${cx + m * sc}" y="${by + 28}" text-anchor="middle" class="sm mut">${m === 0 ? '0' : Math.abs(m) + ' m'}</text>`;
    const stack = {};
    items.forEach(i => {
      if (i.x == null) return; const k = i.x; stack[k] = (stack[k] || 0); const lvl = stack[k]++;
      const w = 44, hh = 22 + Math.min(i.F, 100) * 0.22, x = cx + i.x * sc - w / 2, y = by - 8 - (lvl + 1) * (hh + 3) + 3;
      g += token(i, x, y, w, hh);
    });
    g += '</g>';
    // tray
    g += `<rect x="12" y="256" width="696" height="70" rx="10" fill="none" stroke="var(--line)" stroke-dasharray="5 4"/><text x="22" y="272" class="sm mut">weight tray – drag a weight onto the beam, or use the position boxes below</text>`;
    tray().forEach((i, k) => { const w = 44, hh = 22 + Math.min(i.F, 100) * 0.22; g += token(i, 24 + k * 58, 280, w, hh); });
    view.innerHTML = D.svg(720, 335, g, 'Seesaw with a pivot in the middle and weights placed along the beam');
    const svg = U.$('svg', view); svg.style.touchAction = 'none';
    U.$$('[data-id]', svg).forEach(n => { n.addEventListener('pointerdown', ev => down(ev, n.dataset.id, svg)); n.addEventListener('keydown', ev => key(ev, n.dataset.id)); });
    read.innerHTML = o.showLive || released ? `<div class="acw">Anticlockwise ↺ total: <b>${U.n(t.acw, 2)} Nm</b></div><div class="cw">Clockwise ↻ total: <b>${U.n(t.cw, 2)} Nm</b></div>` : '<div>Work out both totals before you release the beam!</div>';
    tbl();
    rel.disabled = released; rst.disabled = !released;
    if (dragId == null && o.focusId) { const f = U.$('[data-id="' + o.focusId + '"]', view); if (f) f.focus(); o.focusId = null; }
  }
  function token(i, x, y, w, hh){
    const col = i.fixed ? 'var(--muted)' : (i.F >= 50 ? 'var(--c5)' : i.F >= 20 ? 'var(--c6)' : 'var(--c1)');
    const pos = i.x == null ? 'in the tray' : Math.abs(i.x) + ' metres ' + (i.x < 0 ? 'left' : i.x > 0 ? 'right' : 'at the pivot');
    return `<g data-id="${i.id}" class="${i.fixed || released ? '' : 'drag'}" ${i.fixed || released ? '' : 'tabindex="0" role="button"'} aria-label="${i.F} newton weight, ${pos}${i.fixed ? ', fixed' : '. Arrow keys move it, Escape returns it to the tray.'}"><rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="5" fill="${col}" stroke="var(--text)" stroke-width="2"/><text x="${x + w / 2}" y="${y + hh / 2 + 5}" text-anchor="middle" style="fill:#111;font-weight:900;font-size:13px">${i.F} N</text>${i.fixed ? `<text x="${x + w / 2}" y="${y - 4}" text-anchor="middle" class="sm mut">fixed</text>` : ''}</g>`;
  }
  function tbl(){
    table.innerHTML = '';
    const t = h('table', {class:'t'}, h('tr', {}, h('th', {}, 'Weight'), h('th', {}, 'Position (m): − left, + right, blank = tray'), h('th', {}, 'Moment')));
    items.forEach(i => {
      const inp = h('input', {type:'number', step:o.snap, min:-o.half, max:o.half, class:'num', style:'width:7ch', value:i.x == null ? '' : i.x, disabled:i.fixed || released, 'aria-label':'Position of the ' + i.F + ' newton weight in metres', onchange(){ const v = inp.value === '' ? null : Math.max(-o.half, Math.min(o.half, Math.round(parseFloat(inp.value) / o.snap) * o.snap)); i.x = isNaN(v) ? null : v; render(); }});
      const m = i.x == null ? '–' : U.n(i.F * Math.abs(i.x), 2) + ' Nm ' + (i.x < 0 ? '↺' : i.x > 0 ? '↻' : '');
      t.append(h('tr', {}, h('td', {}, i.F + ' N' + (i.fixed ? ' (fixed)' : '')), h('td', {}, inp), h('td', {}, o.showLive || released ? m : '?')));
