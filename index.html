learn:{
'm1.l0':{t:'แหล่งเก็บและการถ่ายโอนพลังงาน',h:'<p>พลังงานวัดเป็น <b>จูล (J)</b> พลังงานถูกเก็บไว้ใน <b>แหล่งเก็บ</b> และเคลื่อนที่ระหว่างแหล่งเก็บผ่าน <b>ช่องทาง</b></p><p>แหล่งเก็บ: จลน์ ศักย์โน้มถ่วง ศักย์ยืดหยุ่น เคมี นิวเคลียร์ ความร้อน แม่เหล็ก และไฟฟ้าสถิต</p><p>สี่ช่องทาง: <b>เชิงกล</b> (โดยแรง) <b>ไฟฟ้า</b> (โดยกระแส) <b>การให้ความร้อน</b> และ <b>การแผ่รังสี</b></p><p><b>แนวคิดสำคัญ: พลังงานอนุรักษ์</b> พลังงานไม่ถูกสร้างหรือทำลาย มักจะ <b>สลายไป</b> ยังแหล่งเก็บพลังงานความร้อนของสิ่งแวดล้อม ทำให้ใช้ประโยชน์ได้น้อยลง เราไม่พูดว่าพลังงาน “ถูกใช้หมด” หรือ “สูญเปล่า”</p>'},
'm1.l1':{t:'แรงและการเคลื่อนที่',h:'<p><b>แรง</b> คือการผลักหรือดึงที่เกิดจากอันตรกิริยาระหว่างวัตถุสองชิ้น วัดเป็น <b>นิวตัน (N)</b> แรงเป็น <b>เวกเตอร์</b> คือมีขนาดและทิศทาง เราจึงวาดเป็นลูกศร ลูกศรยาวกว่าหมายถึงแรงมากกว่า</p><ul><li><b>แรงสัมผัส:</b> การผลัก ดึง แรงเสียดทาน แรงตึง แรงปฏิกิริยาตั้งฉาก</li><li><b>แรงไม่สัมผัส:</b> แรงโน้มถ่วง แรงแม่เหล็ก แรงไฟฟ้าสถิต</li></ul><p>แรงอาจเปลี่ยนอัตราเร็วหรือทิศทางของวัตถุ (ทำให้เร่ง) เปลี่ยนรูปร่าง หรือทำให้หมุน</p><p><b>มวลกับน้ำหนัก:</b> มวลคือปริมาณเนื้อสาร (kg) น้ำหนักคือแรงโน้มถ่วงที่กระทำต่อมวลนั้น (N) มวลไม่เปลี่ยนตามสถานที่ แต่น้ำหนักเปลี่ยน</p>'},
'm1.l2':{t:'แรงลัพธ์: สมดุลหรือไม่สมดุล?',h:'<p><b>แรงลัพธ์</b> คือแรงเดียวที่ให้ผลเท่ากับแรงทั้งหมดที่กระทำต่อวัตถุรวมกัน สำหรับแรงในแนวเส้นตรงเดียวกัน: <b>บวก</b> แรงที่ทิศเดียวกัน และ <b>ลบ</b> แรงที่ทิศตรงข้ามกัน</p><ul><li>เท่ากันและตรงข้ามกัน: แรงลัพธ์ 0 N <b>สมดุล</b> การเคลื่อนที่ไม่เปลี่ยน</li><li>50 − 20 = 30 N ไปทางขวา: <b>ไม่สมดุล</b> วัตถุเร่งไปทางขวา</li></ul>'},
'm1.l3':{t:'ความเร่งของจรวด',h:'<p>จรวดมีแรงหลักสองแรง: <b>แรงขับ</b> ขึ้นด้านบนจากเครื่องยนต์ และ <b>น้ำหนัก</b> ลงด้านล่าง</p><ul><li>แรงขับ = น้ำหนัก: สมดุล แรงลัพธ์ 0 ไม่มีความเร่ง</li><li>แรงขับ &gt; น้ำหนัก: แรงลัพธ์ขึ้นด้านบน จรวด <b>เร่งขึ้น</b></li><li>แรงขับ &lt; น้ำหนัก: แรงลัพธ์ลงด้านล่าง ยกตัวขึ้นไม่ได้</li></ul><p>พลังงานมาจาก <b>แหล่งเก็บพลังงานเคมี</b> ของเชื้อเพลิง ถ่ายโอนเชิงกลไปยังแหล่งเก็บพลังงานจลน์และศักย์โน้มถ่วง (บางส่วนสลายไปเป็นพลังงานความร้อน)</p>'},
'm2.l0':{t:'งานเชิงกลคืออะไร?',h:'<ul><li><b>มีแรงแต่ไม่มีการกระจัด</b> (ถือกระเป๋าอยู่นิ่ง ผลักกำแพง): <b>ไม่มีการทำงาน</b> W = 0 J</li><li><b>แรงทำให้วัตถุเคลื่อนที่</b> (ยก ผลักกล่อง): พลังงานถูกถ่ายโอนเชิงกล</li></ul><p><b>นิยาม:</b> <b>งานที่ทำ</b> คือปริมาณพลังงานที่ถ่ายโอนเชิงกลโดยแรงเมื่อแรงทำให้วัตถุเคลื่อนที่ไปในทิศทางของแรง วัดเป็นจูล (J)</p><p><b>เหนื่อย ≠ ทำงาน:</b> การเหนื่อยจากการถือกระเป๋าหนักไม่ได้แปลว่าทำงาน <i>กับกระเป๋า</i> ถ้ากระเป๋าไม่เคลื่อนที่ W = F × 0 = 0 J</p>'},
'm2.l1':{t:'สมการ W = F × s',h:'<p><b>W = F × s</b> (งานที่ทำ = แรง × ระยะทางที่เคลื่อนที่)</p><ul><li><b>W</b>: งานที่ทำ หน่วย <b>จูล (J)</b></li><li><b>F</b>: แรง หน่วย <b>นิวตัน (N)</b></li><li><b>s</b>: ระยะทางที่เคลื่อนที่ในทิศทางของแรง หน่วย <b>เมตร (m)</b></li></ul><p>1 จูลคืองานที่ทำเมื่อแรง 1 N ทำให้วัตถุเคลื่อนที่ 1 m</p><p><b>ตัวอย่าง:</b> นักเรียนผลักกล่องด้วยแรง 30 N เป็นระยะ 6 m W = F × s = 30 × 6 = <b>180 J</b></p>'},
'm2.l2':{t:'การแปลงหน่วย',h:'<p>สมการนี้ใช้ได้กับ <b>N</b> และ <b>m</b> เท่านั้น แปลงหน่วยก่อนเสมอ!</p><ul><li>cm → m: หารด้วย 100 (250 cm = 2.5 m)</li><li>kN → N: คูณด้วย 1000 (5 kN = 5000 N)</li></ul>'},
'm2.l3':{t:'การจัดรูปสมการ',h:'<p>ปิดปริมาณที่ต้องการหา:</p><p><b>F = W ÷ s</b> &nbsp; และ &nbsp; <b>s = W ÷ F</b></p><p><b>ตัวอย่าง:</b> แรงทำงาน 600 J ขณะเลื่อนรถเข็น 12 m F = W ÷ s = 600 ÷ 12 = <b>50 N</b></p>'},
'm3.l0':{t:'กำลังคืออะไร?',h:'<p>คนงานสองคนทำงานเท่ากัน (แรงเท่ากัน ระยะทางเท่ากัน) A ใช้เวลา 2 นาที B ใช้เวลา 6 นาที ทั้งสองคนมี <b>กำลัง</b> เท่ากันหรือไม่?</p><p><b>กำลัง</b> คืออัตราที่พลังงานถูกถ่ายโอน หรืออัตราที่งานถูกทำ “อัตรา” หมายถึง “ต่อวินาที”</p><ul><li><b>งาน / พลังงาน:</b> ปริมาณทั้งหมดที่ถ่ายโอน เวลาไม่เกี่ยว</li><li><b>กำลัง:</b> ถ่ายโอนได้เร็วแค่ไหน เวลาสำคัญ</li></ul>'},
'm3.l1':{t:'P = W ÷ t และวัตต์',h:'<p><b>P = W ÷ t</b> (กำลัง = งานที่ทำ ÷ เวลา) หรือ <b>P = E ÷ t</b></p><ul><li><b>P</b>: กำลัง หน่วย <b>วัตต์ (W)</b></li><li><b>W</b> (หรือ E): งาน / พลังงาน หน่วย <b>จูล (J)</b></li><li><b>t</b>: เวลา หน่วย <b>วินาที (s)</b></li></ul><p>1 วัตต์ = 1 จูลต่อวินาที (1 W = 1 J/s) หลอดไฟ 60 W ถ่ายโอนพลังงาน 60 J ทุกวินาที 1 kW = 1000 W</p><p><b>ตัวอย่าง:</b> มอเตอร์ถ่ายโอนพลังงาน 1200 J ใน 8 s P = 1200 ÷ 8 = <b>150 W</b></p>'},
'm3.l2':{t:'การจัดรูปสมการ',h:'<p><b>W = P × t</b> &nbsp; และ &nbsp; <b>t = W ÷ P</b></p><p><b>ตัวอย่าง:</b> หลอดไฟ 40 W เปิดอยู่ 30 s W = P × t = 40 × 30 = <b>1200 J</b></p><p><b>ระวังหน่วย:</b> ต้องเป็นวินาที ไม่ใช่นาที! แปลง 2 นาทีเป็น 120 s และแปลง kW เป็น W (× 1000) ก่อนคำนวณเป็นจูล</p>'},
'm3.l3':{t:'เปรียบเทียบอัตราการถ่ายโอนพลังงาน',h:'<p>เมื่อต้องตัดสินว่าเครื่องใดมีกำลังมากกว่า ให้หากำลังของแต่ละเครื่องแล้วเปรียบเทียบ อย่าเปรียบเทียบแค่พลังงานหรือแค่เวลา</p><p>เครื่อง A: 2400 J ใน 8 s = 300 W เครื่อง B: 1800 J ใน 5 s = 360 W</p><p>B ถ่ายโอนพลังงานรวมน้อยกว่าแต่ทำได้เร็วกว่า ดังนั้น B มี <b>กำลังมากกว่า</b></p>'},
'm4.l0':{t:'ตัวแปรและการทดสอบที่ยุติธรรม',h:'<p>การทดลอง: “มวลรวมของก้อนวัตถุส่งผลต่องานที่ทำในการลากมัน 1.0 m เทียบกับแรงเสียดทานอย่างไร?”</p><ul><li><b>ตัวแปรต้น:</b> สิ่งที่คุณตั้งใจเปลี่ยน (มวลรวมของก้อนวัตถุ)</li><li><b>ตัวแปรตาม:</b> สิ่งที่คุณวัดหรือคำนวณ (งานที่ทำ)</li><li><b>ตัวแปรควบคุม:</b> สิ่งที่ทำให้คงที่ (ระยะทาง 1.0 m พื้นผิว ด้านของก้อนวัตถุ มุมที่ลาก อัตราเร็ว เครื่องชั่งสปริง)</li></ul><p><b>ระวัง:</b> สิ่งที่วัดจริงคือแรงลากเป็นนิวตัน ส่วนงานที่ทำ <i>คำนวณ</i> จากแรงเฉลี่ยและระยะทาง การทดสอบที่ยุติธรรมเปลี่ยนเฉพาะตัวแปรต้นและควบคุมทุกอย่างที่เหลือ</p>'},
'm4.l1':{t:'การทำซ้ำ ค่าเฉลี่ย และค่าผิดปกติ',h:'<p>อ่านค่าซ้ำสามครั้งสำหรับแต่ละมวล เพื่อให้เห็นค่าที่ผิดปกติ บันทึกแรงขณะที่ก้อนวัตถุเคลื่อนที่ด้วยอัตราเร็วคงที่ (ไม่ใช่ค่าสูงสุดตอนเริ่มเคลื่อน)</p><p><b>ค่าเฉลี่ย = ผลรวมค่าที่อ่านได้ ÷ จำนวนครั้งที่อ่าน</b> ตัวอย่าง: 1.4 N, 1.5 N, 1.4 N → 4.3 ÷ 3 = 1.43… → 1.4 N (ปัดให้ตรงกับความละเอียดของเครื่องวัด)</p><p><b>ค่าผิดปกติ:</b> ผลที่ไม่เข้ากับรูปแบบของการทำซ้ำ อย่าลบทิ้งโดยอัตโนมัติ เก็บค่าที่อ่านได้ไว้ สืบหาสาเหตุ ทำซ้ำถ้าทำได้ และตัดออกจากค่าเฉลี่ยก็ต่อเมื่อมีเหตุผลทางวิทยาศาสตร์</p>'},
'm4.l2':{t:'คำนวณงานที่ทำและเขียนกราฟ',h:'<p>เมื่อระยะทางเท่ากับ 1.0 m พอดี W = F × s จะให้ตัวเลขของแรงและงานเท่ากัน แต่แรงมีหน่วย N ส่วนงานมีหน่วย J</p><p>เขียนมวลรวมบนแกน x (ตัวแปรต้น) และงานที่ทำบนแกน y (ตัวแปรตาม) ลาก <b>เส้นที่พอดีที่สุด</b> เป็นเส้นเรียบที่มีจุดกระจายสองข้างพอ ๆ กัน ไม่ใช่เชื่อมทีละจุด</p><p>รูปแบบ: เมื่อมวลรวมเพิ่มขึ้น งานที่ทำเพิ่มขึ้น เส้นไม่ผ่านจุดกำเนิด จึงบอกไม่ได้ว่า “แปรผันตรง”</p>'},
'm4.l3':{t:'การประเมินหลักฐาน',h:'<ul><li><b>น่าเชื่อถือ:</b> ผลทำซ้ำได้หรือไม่? ปรับปรุงด้วยการทำซ้ำมากขึ้นและหาค่าเฉลี่ย</li><li><b>ตรงประเด็น:</b> เป็นการทดสอบที่ยุติธรรมและวัดสิ่งที่ต้องการวัดหรือไม่? ปรับปรุงด้วยการควบคุมตัวแปร</li><li><b>แม่นยำ:</b> เครื่องมืออ่านค่าได้ละเอียดแค่ไหน? เครื่องชั่งสปริงที่อ่านได้ 0.05 N แม่นยำกว่า 0.1 N</li></ul><p>การประเมินที่ดีมี: ข้อปรับปรุงที่ชัดเจน เหตุผลว่าทำไมจึงช่วยได้ และข้อจำกัดที่เฉพาะเจาะจง <b>ข้อสรุป:</b> บรรยายรูปแบบ ใช้ข้อมูลจากตาราง และอย่าอ้างเกินกว่าที่ข้อมูลแสดง</p>'},
'm5.l0':{t:'จุดหมุนและผลการหมุน',h:'<p>แรงทำให้วัตถุ <b>หมุน</b> ได้ ประตู ประแจ ไม้กระดก และคาน ล้วนหมุนรอบจุดคงที่</p><ul><li><b>จุดหมุน:</b> จุดคงที่ที่วัตถุหมุนรอบ</li><li><b>ผลการหมุน:</b> แรงทำให้วัตถุหมุนรอบจุดหมุนได้แรงแค่ไหน</li><li><b>โมเมนต์:</b> ชื่อทางวิทยาศาสตร์ของผลการหมุนของแรง (ไม่ใช่ “ชั่วขณะ” ของเวลา!)</li></ul><p>ทำไมที่จับประตูจึงอยู่ด้านตรงข้ามกับบานพับ? การผลักไกลจากจุดหมุนให้ผลการหมุนมากกว่ามากเมื่อใช้แรงเท่ากัน</p><p><b>ตามเข็มนาฬิกา ↻</b> คือหมุนทิศเดียวกับเข็มนาฬิกา <b>ทวนเข็มนาฬิกา ↺</b> คือทิศตรงข้าม แรงลงด้านล่างทางขวาของจุดหมุนหมุนตามเข็ม ส่วนทางซ้ายหมุนทวนเข็ม</p>'},
'm5.l1':{t:'แนวแรงและระยะตั้งฉาก',h:'<p><b>แนวแรง</b> คือเส้นตรงที่แรงกระทำตามแนวนั้น ลากต่อออกไปทั้งสองด้าน <b>ระยะตั้งฉาก</b> คือระยะสั้นที่สุดจากจุดหมุนถึงแนวแรง วัดทำมุม <b>90°</b></p><p><b>ไม่ใช่ความยาวของประแจเสมอไป!</b> ถ้าแนวแรงผ่านจุดหมุน ระยะตั้งฉากเป็น 0 และโมเมนต์เป็น <b>0</b></p>'},
'm5.l2':{t:'สมการโมเมนต์ M = F × d',h:'<p><b>M = F × d</b> (โมเมนต์ = แรง × ระยะตั้งฉาก)</p><ul><li><b>M</b>: โมเมนต์ หน่วยนิวตันเมตร (<b>Nm</b>)</li><li><b>F</b>: แรง หน่วยนิวตัน (N)</li><li><b>d</b>: ระยะตั้งฉาก หน่วยเมตร (m)</li></ul><p><b>Nm ไม่ใช่ J:</b> โมเมนต์วัดเป็น Nm แต่ไม่ใช่พลังงาน ใช้ J สำหรับงานที่ทำ และ Nm สำหรับโมเมนต์ ระบุทิศทาง (↻ หรือ ↺) เสมอ</p>'},
'm5.l3':{t:'การจัดรูปสมการและแปลง ซม. เป็น ม.',h:'<p><b>F = M ÷ d</b> &nbsp; และ &nbsp; <b>d = M ÷ F</b></p><p><b>ตัวอย่าง:</b> น็อตต้องใช้โมเมนต์ 6.0 Nm ประแจยาว 0.15 m: F = 6.0 ÷ 0.15 = <b>40 N</b> ถ้าใช้ประแจยาว 0.30 m ใช้แรงเพียง 20 N</p><p>แปลง cm เป็น m ก่อน: 35 cm ÷ 100 = 0.35 m</p>'},
'm6.l0':{t:'หลักการของโมเมนต์',h:'<p>คานจะหมุนถ้าโมเมนต์ด้านหนึ่งมากกว่าอีกด้าน และจะสมดุลเมื่อทั้งสองเท่ากัน</p><p><b>หลักการของโมเมนต์:</b> สำหรับวัตถุที่สมดุล โมเมนต์ <b>ตามเข็มนาฬิกา</b> รวมรอบจุดหมุน = โมเมนต์ <b>ทวนเข็มนาฬิกา</b> รวมรอบจุดหมุนเดียวกัน</p><p>ตัวอย่าง: ↺ 60 × 1.0 = 60 Nm และ ↻ 40 × 1.5 = 60 Nm → <b>สมดุล</b> แม้แรงจะต่างกัน</p><p><b>เปรียบเทียบโมเมนต์ ไม่ใช่แรง</b> แรงเท่ากันไม่ได้รับประกันว่าสมดุล และแรงต่างกันก็สมดุลได้</p>'},
'm6.l1':{t:'ผลรวมเมื่อมีหลายแรง',h:'<p>รวมโมเมนต์ของแต่ละด้าน <b>แยกกัน</b> อย่ารวมโมเมนต์ตามเข็มกับทวนเข็มเข้าด้วยกัน</p><p>↺: 20 × 3 + 50 × 1 = 110 Nm ↻: 60 × 2 = 120 Nm เนื่องจาก 120 &gt; 110 คานหมุน <b>ตามเข็มนาฬิกา</b></p><p><b>ตำแหน่งเดียวกัน? รวมแรงก่อน</b> คน 4 คน คนละ 600 N อยู่ห่างจุดหมุน 2 m: แรงรวม = 4 × 600 = 2400 N โมเมนต์ = 2400 × 2 = 4800 Nm (ไม่ใช่ 600 × 2!)</p>'},
'm6.l2':{t:'หาแรงที่ไม่ทราบค่า',h:'<p>ตุ้มน้ำหนัก 60 N อยู่ห่างไปทางซ้าย 1.0 m ต้องวางน้ำหนักเท่าใดที่ห่างไปทางขวา 1.5 m จึงจะสมดุล?</p><p>โมเมนต์ทวนเข็ม = 60 × 1.0 = 60 Nm เมื่อสมดุล โมเมนต์ตามเข็ม = 60 Nm F × 1.5 = 60 ดังนั้น F = 60 ÷ 1.5 = <b>40 N</b></p>'},
'm6.l3':{t:'หาระยะทางที่ไม่ทราบค่า',h:'<p>ตุ้มน้ำหนัก 30 N อยู่ห่างไปทางซ้าย 0.8 m ทางขวามีตุ้มน้ำหนัก 60 N ต้องวางไว้ที่ใด?</p><p>↺ = 30 × 0.8 = 24 Nm 60 × d = 24 ดังนั้น d = 24 ÷ 60 = <b>0.4 m</b></p><p>ถ้าระยะทางเป็น cm ให้แปลงเป็น m (หรือใช้ cm ทั้งหมด แต่ต้องสม่ำเสมอ)</p>'},
'm7.l0':{t:'ส่วนของคาน: จุดค้ำ แรงที่ใช้ น้ำหนักที่ยก',h:'<p><b>คาน</b> คือวัตถุแข็งที่หมุนรอบจุดหมุน ซึ่งในคานเรียกว่า <b>จุดค้ำ</b></p><ul><li><b>จุดค้ำ:</b> จุดที่คานหมุนรอบ</li><li><b>แรงที่ใช้:</b> แรงที่คุณออก</li><li><b>น้ำหนักที่ยก (ภาระ):</b> แรงที่ต้องเอาชนะ (เช่น น้ำหนัก)</li><li><b>แขนของแรงที่ใช้ / แขนของภาระ:</b> ระยะตั้งฉากจากจุดหมุนถึงแต่ละแรง</li></ul><p>เมื่อสมดุล: <b>แรงที่ใช้ × แขนของแรงที่ใช้ = ภาระ × แขนของภาระ</b></p>'},
'm7.l1':{t:'คานสามประเภท',h:'<p>สิ่งที่อยู่ตรงกลางบอกประเภทของคาน จำว่า <b>F-L-E = 1-2-3</b>: จุดค้ำ (Fulcrum) อยู่ตรงกลาง = ประเภท 1, ภาระ (Load) = ประเภท 2, แรงที่ใช้ (Effort) = ประเภท 3</p><ul><li><b>ประเภท 1:</b> ไม้กระดก กรรไกร ชะแลง</li><li><b>ประเภท 2:</b> รถเข็นล้อเดียว ที่หนีบถั่ว ที่เปิดขวด</li><li><b>ประเภท 3:</b> แหนบคีบ ปลายแขนของมนุษย์</li></ul><p><b>รถเข็นล้อเดียว:</b> จุดหมุนคือแกนล้อ ภาระอยู่ในกะบะระหว่างแกนล้อกับมือจับ และแรงที่ใช้อยู่ที่มือจับ ภาระอยู่ตรงกลาง จึงเป็นคาน <b>ประเภท 2</b> มือจับที่ยาวขึ้นทำให้แขนของแรงที่ใช้ยาวขึ้น จึงใช้แรงน้อยลง</p>'},
'm7.l2':{t:'การได้เปรียบเชิงกล',h:'<p><b>MA = ภาระ ÷ แรงที่ใช้</b> &nbsp; และสำหรับคานอุดมคติ &nbsp; <b>MA = แขนของแรงที่ใช้ ÷ แขนของภาระ</b> MA เป็นอัตราส่วน <b>ไม่มีหน่วย</b></p><ul><li><b>MA &gt; 1:</b> แรงถูกขยาย (ใช้แรงน้อย ยกของหนัก) แรงที่ใช้เคลื่อนที่ไกลกว่า</li><li><b>MA = 1:</b> ไม่ได้เปรียบเรื่องแรง</li><li><b>MA &lt; 1:</b> ได้ระยะทางและความเร็ว (เช่น ปลายแขน) แต่ต้องใช้แรงมากขึ้น</li></ul><p><b>ทำไมคานยาวจึงช่วยได้:</b> ยิ่งแขนของแรงที่ใช้ยาวกว่าแขนของภาระมาก MA ยิ่งมาก</p>'},
'm7.l3':{t:'การแลกเปลี่ยนระหว่างแรงกับระยะทาง',h:'<p>เครื่องกลไม่ได้สร้างพลังงาน แต่ <b>แลกแรงกับระยะทาง</b></p><p>คาน: แรงที่ใช้ 100 N เคลื่อนลง 0.30 m ภาระ 300 N ยกขึ้น 0.10 m (MA = 3) งานป้อนเข้า = 100 × 0.30 = <b>30 J</b> งานที่ได้ออกมา = 300 × 0.10 = <b>30 J</b> เท่ากันในคานอุดมคติ</p><p>เครื่องกลจริงมีแรงเสียดทาน พลังงานบางส่วนสลายไปเป็นพลังงานความร้อน งานที่ได้ใช้ประโยชน์จึงน้อยกว่างานที่ป้อนเข้า</p>'},
'm7.l4':{t:'วิศวกรรมและเสถียรภาพ',h:'<p>วิศวกรใช้โมเมนต์เพื่อให้โครงสร้างและยานพาหนะมั่นคง: เครนใช้ตัวถ่วงน้ำหนัก สะพานสร้างยื่นออกไปเท่ากันสองข้างจากเสาหลัก และสิ่งของบนรถพ่วงต้องไม่ทำให้เกิดโมเมนต์ด้านหลังเพลามากเกินไป</p><p>ในภารกิจรถบัส คุณจำลองรถบัสเป็นคานแข็งวางบนจุดหมุน โดยมีภาระเป็นจุด เพื่อพิสูจน์ว่ามั่นคง ให้คำนวณโมเมนต์ตามเข็มและทวนเข็มรวม แล้วแสดงว่าเท่ากัน</p><p><b>แบบจำลองมีข้อจำกัด:</b> มวลจริงกระจายตัว ตัวรถมีน้ำหนักของตัวเอง ฐานรองมีแรงเสียดทาน โครงสร้างโค้งงอ และผู้โดยสารเคลื่อนที่ ให้บอกเสมอว่าแบบจำลองของคุณละเลยอะไร</p>'},
'm8.l0':{t:'การประเมินทำงานอย่างไร',h:'<p>คำถามวัดทักษะสามด้าน (จุดประสงค์การประเมิน):</p><ul><li><b>AO1 – ความรู้:</b> ระบุ เรียกชื่อ เขียนสมการ ให้หน่วย นิยาม</li><li><b>AO2 – การประยุกต์:</b> คำนวณด้วยสมการ อธิบายสถานการณ์ด้วยแนวคิดวิทยาศาสตร์</li><li><b>AO3 – การวิเคราะห์และประเมิน:</b> หาค่า ตีความข้อมูล ให้เหตุผลสนับสนุนข้อสรุป อธิบายการออกแบบในชีวิตจริง</li></ul><p>ดูจำนวนคะแนน: 2 คะแนน ≈ 2 ประเด็นหรือ 2 ขั้นตอน โจทย์คำนวณ 2 คะแนนมักให้ 1 คะแนนสำหรับวิธีทำ/ตัวเลข และ 1 คะแนนสำหรับหน่วยที่ถูกต้อง</p>'},
'm8.l1':{t:'คำสั่งในข้อสอบ',h:'<ul><li><b>State / Name (ระบุ / เรียกชื่อ):</b> ให้ข้อเท็จจริงสั้น ๆ ไม่ต้องอธิบาย</li><li><b>Calculate (คำนวณ):</b> ใช้สมการ เขียนสมการ แทนค่า ให้คำตอบพร้อม <b>หน่วย</b></li><li><b>Determine (หาค่า/ตัดสิน):</b> หาจากข้อมูลที่ให้ โดยแสดงการเปรียบเทียบ (เช่น โมเมนต์ทั้งสองด้าน)</li><li><b>Explain (อธิบาย):</b> ให้เหตุผลด้วยคำว่า “เพราะ / ดังนั้น” เชื่อมเหตุกับผลด้วยคำศัพท์วิทยาศาสตร์</li><li><b>Describe (บรรยาย):</b> บอกว่าเกิดอะไรขึ้นตามลำดับ</li><li><b>Evaluate (ประเมิน):</b> ชั่งน้ำหนักจุดแข็งและข้อจำกัด แล้วสรุปพร้อมเหตุผล</li></ul>'},
'm8.l2':{t:'ชุดสมการของคุณ',h:'<ul><li>งานที่ทำ: <b>W = F × s</b> (J = N × m)</li><li>กำลัง: <b>P = W ÷ t</b> (W = J ÷ s)</li><li>โมเมนต์: <b>M = F × d</b> (Nm = N × m)</li><li>หลักการของโมเมนต์: โมเมนต์ตามเข็มรวม = โมเมนต์ทวนเข็มรวม</li><li>การได้เปรียบเชิงกล: <b>MA = ภาระ ÷ แรงที่ใช้</b> = แขนของแรงที่ใช้ ÷ แขนของภาระ (ไม่มีหน่วย)</li><li>แรงลัพธ์: ลบแรงที่ทิศตรงข้ามกัน บวกแรงที่ทิศเดียวกัน</li></ul><p>เปิด “ชุดเครื่องมือ” จากเมนูด้านบนได้ทุกเมื่อ</p>'},
'm8.l3':{t:'ข้อผิดพลาดที่ทำให้เสียคะแนน',h:'<ul><li>ลืมหน่วย (J สำหรับงาน W สำหรับกำลัง Nm สำหรับโมเมนต์ N สำหรับแรง)</li><li>ไม่แปลง cm → m หรือ kN → N ก่อนคำนวณ</li><li>ใช้น้ำหนักของคนเดียวเมื่อมีหลายคนยืนที่ตำแหน่งเดียวกัน: ต้องรวมแรงก่อน</li><li>เปรียบเทียบแรงแทนที่จะเปรียบเทียบโมเมนต์เพื่อตัดสินว่าสมดุลหรือไม่</li><li>รวมโมเมนต์ตามเข็มกับทวนเข็มเข้าด้วยกัน</li><li>เขียนว่า “ไม่มีการใช้พลังงาน” แทนที่จะเป็น “ไม่มีการถ่ายโอนพลังงาน” หรือ “พลังงานสูญเปล่า” แทนที่จะเป็น “สลายไปยังแหล่งเก็บพลังงานความร้อน”</li><li>เขียนว่า “เครื่องกลสร้างพลังงาน” — ที่จริงเครื่องกลถ่ายโอนพลังงานและแลกแรงกับระยะทาง</li><li>ลบผลที่ผิดปกติทิ้งแทนที่จะสืบหาสาเหตุ</li></ul>'}
}
});
</script>
<script>/* Application shell: routing, dashboard, module pages, trophy cabinet, settings, toolkit. */
(function(){
const U = PA.util, h = U.h, $ = U.$, Store = PA.store, Q = PA.Q;
const TOPICS = {energy:['Energy stores and transfers', 1], forces:['Forces and resultants', 1], work:['Work done', 2], power:['Power', 3], investigation:['Scientific investigation', 4], moments:['Moments', 5], balance:['Balanced moments', 6], levers:['Levers and engineering', 7]};
const STAGE_NAMES = {learn:'Learn', watch:'Watch', practise:'Practise', challenge:'Challenge', master:'Master'};
const main = () => $('#main');
const mod = id => PA.modules.find(m => m.id === +id);

/* ---------- boot ---------- */
function applySettings(){
  const s = Store.state.settings;
  document.documentElement.dataset.theme = s.theme || 'auto';
  document.documentElement.style.setProperty('--fs', s.size || 1);
  document.body.classList.toggle('no-anim', !s.anim);
}
function updateChip(pulse){
  const S = Store.state, l = Store.level(), c = $('#xpchip'); if (!c) return;
  c.innerHTML = `<span class="lv">Lv ${l.n}</span><span>${S.xp} XP</span>`;
  c.setAttribute('aria-label', `Level ${l.n}, ${l.name}, ${S.xp} experience points`);
  if (pulse && S.settings.anim) { c.classList.remove('pulse'); void c.offsetWidth; c.classList.add('pulse'); }
}
Store.onXP = (n) => { updateChip(true); PA.gamify.toast('+' + n + ' XP'); U.announce('Plus ' + n + ' experience points'); };
Store.onLevel = l => PA.gamify.levelUp(l);
Store.onSave = () => { sync(); };

/* ---------- optional backend sync (only if config.syncUrl is set) ---------- */
let syncStatus = 'Standalone mode – nothing is sent anywhere.';
const sync = U.debounce(function(){
  const cfg = window.PA_CONFIG || {}; const S = Store.state;
  if (!cfg.syncUrl || !S.name) return;
  fetch(cfg.syncUrl, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(PA.summary())})
    .then(r => { syncStatus = r.ok ? 'Last synced with teacher server at ' + new Date().toLocaleTimeString() : 'Teacher server replied with an error (' + r.status + ').'; })
    .catch(() => { syncStatus = 'Could not reach the teacher server – your progress is still saved on this device.'; });
}, 4000);
PA.summary = function(){
  const S = Store.state, l = Store.level();
  return {app:'9P1-academy', v:1, exported:new Date().toISOString(), name:S.name, cls:S.cls || (window.PA_CONFIG || {}).classCode || '', xp:S.xp, level:l.n, levelName:l.name, badges:S.badges, mastery:S.mastery, stages:S.stages, topics:S.topics, ao:S.ao, assess:S.assess, counters:S.counters, sprintBest:S.sprintBest, updated:new Date(S.updated).toISOString(),
    questionsDone:Object.keys(S.q).filter(k => S.q[k].done).length, recent:S.events.filter(e => e.type === 'q').slice(-40)};
};

/* ---------- router ---------- */
function route(){
  const hash = location.hash || '#/home'; const parts = hash.slice(2).split('/');
  const m = main(); m.innerHTML = '';
  U.$$('nav.main a').forEach(a => a.removeAttribute('aria-current'));
  const setNav = id => { const a = $('#nav-' + id); if (a) a.setAttribute('aria-current', 'page'); };
  try {
    if (parts[0] === 'm' && mod(parts[1])) { Store.state.last = hash; Store._save(); moduleView(mod(parts[1]), parts[2] || firstOpenStage(parts[1])); setNav('home'); }
    else if (parts[0] === 'trophies') { trophyView(); setNav('trophies'); }
    else if (parts[0] === 'settings') { settingsView(); setNav('settings'); }
    else { homeView(); setNav('home'); }
  } catch (e) { m.append(h('div', {class:'card'}, h('h2', {}, 'Something went wrong'), h('p', {}, 'Please go back to the home page and try again. Technical detail: ' + e.message), h('a', {class:'btn', href:'#/home'}, 'Back to home'))); console.error(e); }
  window.scrollTo(0, 0);
  const hd = $('h1', m) || $('h2', m); if (hd) { hd.setAttribute('tabindex', '-1'); hd.focus({preventScroll:true}); }
  document.title = (hd ? hd.textContent + ' – ' : '') + '9P1 Work & Moments Academy';
}
function firstOpenStage(id){ const st = Store.STAGES.find(s => !Store.stageDone(+id, s)); return st || 'learn'; }

/* ---------- dashboard ---------- */
function nextStep(){
  for (const m of PA.modules) for (const s of Store.STAGES) if (!Store.stageDone(m.id, s)) return {m, s};
  return null;
}
function weakTopic(){
  const T = Store.state.topics; let worst = null;
  Object.keys(T).forEach(k => { const t = T[k]; if (t.a >= 4 && TOPICS[k]) { const p = t.c / t.a; if (p < 0.7 && (!worst || p < worst.p)) worst = {k, p}; } });
  return worst;
}
function homeView(){
  const S = Store.state, l = Store.level(), nl = Store.nextLevel(), m = main();
  const done = Object.values(S.q).filter(q => q.done).length;
  const att = Object.values(S.topics).reduce((a, t) => a + t.a, 0), cor = Object.values(S.topics).reduce((a, t) => a + t.c, 0);
  const mastered = PA.modules.filter(x => Store.mastered(x.id)).length;
  const pct = nl ? Math.round(100 * (S.xp - l.xp) / (nl.xp - l.xp)) : 100;
  if (!Store.persistent()) m.append(h('div', {class:'fb part'}, h('b', {}, 'Your progress cannot be saved in this browser right now '), '(private window or blocked storage). You can keep working, but it will be lost when you close the tab. Use Settings → “Save my progress file” before you leave.'));
  const hello = S.name ? 'Welcome back, ' + S.name : 'Welcome to the Academy';
  const next = nextStep();
  const cont = h('a', {class:'btn primary', href: (S.last && S.last.startsWith('#/m/') ? S.last : (next ? `#/m/${next.m.id}/${next.s}` : '#/m/8/master'))}, S.xp || Object.keys(S.stages).length ? 'Continue where you left off' : 'Start Module 1');
  const hero = h('section', {class:'hero', 'aria-label':'Your progress'},
    h('div', {class:'card'},
      h('h1', {}, hello),
      h('p', {}, '9P1 Work & Moments revision. Learn it, watch it, practise it, then prove it.'),

/* ---------- toolkit (equations, units, glossary) ---------- */
const GLOSS = [['Anomaly', 'A result that does not fit the pattern of the repeats. Investigate it; never delete it automatically.'], ['Anticlockwise ↺', 'Turning the opposite way to a clock’s hands.'], ['Balanced forces', 'Forces whose resultant is zero: no change in motion.'], ['Clockwise ↻', 'Turning the same way as a clock’s hands.'], ['Conserved', 'Energy is never created or destroyed; the total stays the same.'], ['Control variable', 'A variable kept the same to make a test fair.'], ['Dependent variable', 'The variable you measure or calculate.'], ['Dissipated', 'Energy spread out to the thermal store of the surroundings, making it less useful.'], ['Effort', 'The force you apply to a lever.'], ['Fulcrum', 'The pivot of a lever.'], ['Independent variable', 'The variable you deliberately change.'], ['Joule (J)', 'Unit of energy and work done. 1 J = 1 N × 1 m.'], ['Lever', 'A rigid object that turns about a pivot.'], ['Line of action', 'The straight line along which a force acts, extended both ways.'], ['Load', 'The force a machine overcomes or moves.'], ['Mechanical advantage', 'Load ÷ effort. A ratio with no unit.'], ['Moment', 'The turning effect of a force about a pivot. M = F × d, in Nm.'], ['Perpendicular distance', 'Shortest distance from the pivot to the line of action, at 90°.'], ['Pivot', 'The fixed point an object turns about.'], ['Power', 'The rate of energy transfer or doing work. P = W ÷ t, in watts.'], ['Principle of moments', 'For balance, total clockwise moment = total anticlockwise moment.'], ['Reliable', 'Results that can be repeated and give consistent values.'], ['Resultant force', 'The single force with the same effect as all the forces combined.'], ['Valid', 'A fair test that measures what it claims to.'], ['Watt (W)', 'Unit of power. 1 W = 1 J/s.'], ['Work done', 'Energy transferred mechanically by a force moving an object. W = F × s, in joules.']];
function toolkit(){
  const prev = document.activeElement;
  const bg = h('div', {class:'modal-bg', role:'dialog', 'aria-modal':'true', 'aria-label':'Toolkit'});
  const close = h('button', {class:'btn sm', onclick(){ bg.remove(); if (prev && prev.focus) prev.focus(); }}, 'Close');
  const q = h('input', {type:'search', placeholder:'Search the glossary…', 'aria-label':'Search the glossary'});
  const list = h('div'); const draw = () => { list.innerHTML = ''; GLOSS.filter(g => { const t = PA.i18n.gloss(g[0]); return (g[0] + g[1] + (t ? t[0] + t[1] : '')).toLowerCase().includes(q.value.toLowerCase()); }).forEach(g => { const t = PA.i18n.gloss(g[0]); list.append(h('p', {style:'margin:.3em 0'}, h('b', {}, g[0] + ': '), g[1], t ? h('span', {class:'tr', lang:PA.i18n.lang}, h('b', {}, t[0] + ': '), t[1]) : '')); }); };
  q.addEventListener('input', draw); draw();
  bg.append(h('div', {class:'modal', style:'max-width:680px;text-align:left'}, h('div', {class:'row spread'}, h('h2', {}, '🧰 Toolkit'), close),
    h('div', {html:'<h3>Equations</h3><table class="t"><tr><th>Idea</th><th>Equation</th><th>Units</th></tr><tr><td>Work done</td><td>W = F × s</td><td>J, N, m</td></tr><tr><td>Power</td><td>P = W ÷ t</td><td>W, J, s</td></tr><tr><td>Moment</td><td>M = F × d</td><td>Nm, N, m</td></tr><tr><td>Mechanical advantage</td><td>MA = load ÷ effort</td><td>no unit</td></tr><tr><td>Principle of moments</td><td colspan="2">total ↻ = total ↺</td></tr></table><h3>Conversions</h3><p>cm → m: ÷ 100 &nbsp; kN → N: × 1000 &nbsp; kW → W: × 1000</p><h3>Glossary</h3>'}), q, list));
  bg.addEventListener('keydown', e => { if (e.key === 'Escape') close.click(); });
  document.body.append(bg); q.focus();
}
